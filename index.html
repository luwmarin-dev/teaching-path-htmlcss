<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraft Kids 👾 HTML & CSS Educational Adventure</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

  <!-- Google Fonts: Outfit for friendly UI, Fira Code for clean syntax -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
/* Inlined Stylesheet */
/* ===================================================================
   CodeCraft Kids: Educational HTML & CSS Platform Stylesheet
   Vibrant, playful, highly legible, accessible, and delightful!
   =================================================================== */

:root {
  --font-main: 'Outfit', 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  
  /* Primary Theme Palette (Candy / Adventure) */
  --bg-app: #f4f7fc;
  --bg-card: #ffffff;
  --bg-sidebar: #ffffff;
  --bg-code: #1e1e2e;
  --text-main: #2c3e50;
  --text-muted: #7f8c8d;
  --text-code: #f8f8f2;
  
  --primary: #6c5ce7;
  --primary-hover: #5b4cc4;
  --primary-light: #ece9fb;
  --secondary: #00cec9;
  --accent-pink: #fd79a8;
  --accent-yellow: #feca57;
  --accent-green: #2ed573;
  --accent-red: #ff4757;
  
  --border-color: #e2e8f0;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 24px rgba(108, 92, 231, 0.08);
  --shadow-lg: 0 16px 40px rgba(108, 92, 231, 0.12);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  
  --header-height: 70px;
}

/* Theme Variations */
body[data-theme="arcade"] {
  --bg-app: #0f1016;
  --bg-card: #191b26;
  --bg-sidebar: #13151f;
  --bg-code: #0b0c10;
  --text-main: #f1f2f6;
  --text-muted: #a4b0be;
  --primary: #ff007f;
  --primary-hover: #e00070;
  --primary-light: #301026;
  --secondary: #00f2fe;
  --border-color: #2b2e3f;
  --shadow-md: 0 8px 24px rgba(255, 0, 127, 0.15);
}

body[data-theme="space"] {
  --bg-app: #090a10;
  --bg-card: #121422;
  --bg-sidebar: #0e101b;
  --bg-code: #07080e;
  --text-main: #e2e8f0;
  --text-muted: #8b9bb4;
  --primary: #4834d4;
  --primary-hover: #3b2bb0;
  --primary-light: #181938;
  --secondary: #22a6b3;
  --border-color: #21253a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-app);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* ===================================================================
   Header & Navigation
   =================================================================== */
.app-header {
  height: var(--header-height);
  background-color: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.brand-mascot {
  font-size: 34px;
  animation: floatMascot 3s infinite ease-in-out;
  display: inline-block;
}

@keyframes floatMascot {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-5px) rotate(4deg); }
}

.brand-text h1 {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.brand-text span {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background-color: var(--primary-light);
  color: var(--primary);
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-weight: 800;
  font-size: 14px;
  box-shadow: var(--shadow-sm);
}

.student-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background-color: var(--bg-app);
  border: 1px solid var(--border-color);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.student-badge:hover {
  transform: scale(1.04);
  border-color: var(--primary);
}

.nav-btn {
  background: var(--bg-app);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.nav-btn:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

.nav-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.nav-btn-highlight {
  background: linear-gradient(135deg, #ff4757, #ff6b81);
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
}

.nav-btn-highlight:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(255, 71, 87, 0.4);
}

/* ===================================================================
   Main Layout: Sidebar + Workspace Stage
   =================================================================== */
.app-layout {
  display: flex;
  flex: 1;
  height: calc(100vh - var(--header-height));
  overflow: hidden;
}

/* Sidebar */
.app-sidebar {
  width: 320px;
  background-color: var(--bg-sidebar);
  border-right: 2px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  user-select: none;
  transition: all 0.3s ease;
}

.sidebar-progress {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-app);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.progress-track {
  height: 10px;
  background-color: var(--border-color);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--secondary), var(--primary));
  width: 0%;
  border-radius: var(--radius-full);
  transition: width 0.5s ease;
}

.nav-section-title {
  padding: 16px 20px 8px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.lesson-list {
  list-style: none;
  padding: 0 10px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 4px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  position: relative;
}

.lesson-item:hover {
  background-color: var(--primary-light);
  color: var(--primary);
}

.lesson-item.active {
  background-color: var(--primary);
  color: white;
  box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
}

.lesson-item.completed::after {
  content: '⭐';
  position: absolute;
  right: 12px;
  font-size: 14px;
}

.lesson-item-icon {
  font-size: 18px;
}

.lesson-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===================================================================
   Workspace Content Stage
   =================================================================== */
.workspace-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background-color: var(--bg-app);
}

.lesson-banner {
  background-color: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  padding: 20px 28px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.banner-main {
  flex: 1;
}

.banner-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.badge-module {
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.badge-tags {
  font-family: var(--font-code);
  background-color: var(--bg-app);
  border: 1px solid var(--border-color);
  color: var(--accent-pink);
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
}

.banner-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.banner-summary {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.5;
}

.banner-controls {
  display: flex;
  gap: 10px;
}

.btn-pill-action {
  background: var(--bg-app);
  border: 2px solid var(--border-color);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-pill-action:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-light);
}

.btn-pill-action.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* Teacher Box (Parent / Teacher Mode) */
.teacher-playbook {
  background: #fff9db;
  border: 2px dashed #f59f00;
  border-radius: var(--radius-md);
  margin: 16px 28px 0;
  padding: 16px 20px;
  color: #664d03;
  animation: slideDown 0.3s ease;
}

body[data-theme="arcade"] .teacher-playbook,
body[data-theme="space"] .teacher-playbook {
  background: #2a2415;
  border-color: #f59f00;
  color: #ffe066;
}

.teacher-playbook h4 {
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.teacher-playbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
  font-size: 13px;
}

.teacher-item strong {
  display: block;
  color: #d9480f;
  margin-bottom: 2px;
}

/* ===================================================================
   Story & Explanatory Accordion
   =================================================================== */
.lesson-story-card {
  margin: 16px 28px 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.story-icon {
  font-size: 36px;
  background: var(--primary-light);
  padding: 10px;
  border-radius: var(--radius-md);
}

.story-body h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--primary);
}

.story-body p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-main);
  white-space: pre-line;
}

/* ===================================================================
   Editor & Dual Preview Split
   =================================================================== */
.editor-stage-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px 28px;
  flex: 1;
}

/* Left Pane: Code Studio */
.pane-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.pane-header {
  background-color: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.pane-title {
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pane-tools {
  display: flex;
  gap: 6px;
}

.btn-tool {
  background: var(--bg-app);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-tool:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

/* Quick Tags Toolbar */
.quick-tags-bar {
  background: var(--bg-app);
  border-bottom: 1px solid var(--border-color);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
}

.quick-tag-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.tag-chip {
  font-family: var(--font-code);
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--primary);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.tag-chip:hover {
  background: var(--primary);
  color: white;
  transform: translateY(-1px);
}

/* Code Editor Textarea */
.code-editor-wrapper {
  flex: 1;
  position: relative;
  background: var(--bg-code);
  display: flex;
  min-height: 380px;
}

.editor-line-numbers {
  width: 44px;
  background: rgba(0, 0, 0, 0.2);
  color: #6272a4;
  font-family: var(--font-code);
  font-size: 13px;
  line-height: 22px;
  padding: 14px 6px;
  text-align: right;
  user-select: none;
  border-right: 1px solid rgba(255, 255, 255, 0.05);
}

.code-textarea {
  flex: 1;
  background: transparent;
  color: var(--text-code);
  font-family: var(--font-code);
  font-size: 14px;
  line-height: 22px;
  padding: 14px 16px;
  border: none;
  outline: none;
  resize: none;
  white-space: pre;
  tab-size: 2;
}

/* Right Pane: Dual Preview Stage */
.preview-tabs {
  display: flex;
  background: var(--bg-app);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 4px;
}

.prev-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.prev-tab-btn.active {
  background: var(--bg-card);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

.preview-wrapper {
  flex: 1;
  position: relative;
  min-height: 380px;
  background: #ffffff;
  display: flex;
}

.preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #ffffff;
}

.target-view-container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
}

.target-explanation-box {
  background: #f8fafc;
  border-bottom: 2px dashed #cbd5e1;
  padding: 14px 18px;
  font-size: 13px;
  line-height: 1.5;
  color: #334155;
}

.target-explanation-box strong {
  color: #0f172a;
}

/* ===================================================================
   Challenge Mission Bar (Bottom sticky action dock)
   =================================================================== */
.mission-dock {
  background: var(--bg-card);
  border-top: 2px solid var(--border-color);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: sticky;
  bottom: 0;
  z-index: 90;
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
}

.mission-info {
  flex: 1;
}

.mission-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent-pink);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.mission-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
}

.mission-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-hint {
  background: var(--bg-app);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-hint:hover {
  background: #fff9db;
  color: #f59f00;
  border-color: #f59f00;
}

.btn-verify {
  background: linear-gradient(135deg, var(--accent-green), #20bf6b);
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 15px rgba(46, 213, 115, 0.35);
  transition: all 0.2s;
}

.btn-verify:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(46, 213, 115, 0.45);
}

/* ===================================================================
   Labs Styling (Box Model, Flexbox, Color)
   =================================================================== */
.lab-container {
  padding: 24px 28px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.lab-header {
  margin-bottom: 24px;
}

.lab-header h3 {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 6px;
}

.lab-header p {
  color: var(--text-muted);
  font-size: 15px;
}

.lab-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 24px;
  align-items: start;
}

.lab-controls {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.control-group label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
}

.control-group input[type="range"] {
  width: 100%;
  accent-color: var(--primary);
}

.color-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.color-preset-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.preset-btn {
  border: none;
  color: white;
  font-weight: 800;
  font-size: 12px;
  padding: 10px;
  border-radius: var(--radius-md);
  cursor: pointer;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}

.preset-btn:hover {
  transform: scale(1.04);
}

.btn-pill-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.btn-pill {
  background: var(--bg-app);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-pill:hover {
  background: var(--primary-light);
  color: var(--primary);
}

.btn-pill.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.lab-code-output {
  background: var(--bg-code);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  color: var(--text-code);
  font-family: var(--font-code);
  font-size: 12px;
}

.code-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  color: #8be9fd;
  font-weight: bold;
}

.btn-sm {
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: white;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 11px;
}

.btn-sm:hover {

  // --- Validator Module ---
  /**
 * CodeCraft Challenge Validator
 * Evaluates whether student HTML/CSS code meets the learning objectives.
 */

function validateChallenge(code, rules = []) {
  if (!code || typeof code !== 'string') {
    return {
      passed: false,
      feedback: ['Write some code in the editor to start the challenge!']
    };
  }

  const feedback = [];

  for (const rule of rules) {
    let passed = false;

    switch (rule.type) {
      case 'hasTag': {
        const tagRegex = new RegExp(`<\\s*${rule.tag}(\\s+[^>]*)?>`, 'i');
        passed = tagRegex.test(code);
        break;
      }

      case 'hasAttribute': {
        // Looks for <tag ... attr="..." or attr='...' or attr>
        const attrRegex = new RegExp(`<\\s*${rule.tag}[^>]*\\s+${rule.attribute}(?:\\s*=\\s*["'][^"']*["'])?[^>]*>`, 'i');
        passed = attrRegex.test(code);
        break;
      }

      case 'hasCssProperty': {
        // Check for style tag or inline style with property: value
        // Matches e.g. color: hotpink; or style="... color: hotpink ..."
        const escapedProp = rule.property.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const cssRegex = new RegExp(`${escapedProp}\\s*:\\s*([^;}"']+)`, 'gi');
        let match;
        while ((match = cssRegex.exec(code)) !== null) {
          const val = match[1].trim();
          if (!rule.valuePattern || rule.valuePattern.test(val)) {
            passed = true;
            break;
          }
        }
        break;
      }

      case 'tagContainsText': {
        // Matches <tag ...>content</tag>
        const tagContentRegex = new RegExp(`<\\s*${rule.tag}[^>]*>([\\s\\S]*?)<\\s*\\/\\s*${rule.tag}\\s*>`, 'i');
        const match = tagContentRegex.exec(code);
        if (match) {
          const innerText = match[1].replace(/<[^>]+>/g, '').trim();
          if (rule.pattern instanceof RegExp) {
            passed = rule.pattern.test(innerText);
          } else if (typeof rule.pattern === 'string') {
            passed = innerText.toLowerCase().includes(rule.pattern.toLowerCase());
          } else {
            passed = innerText.length > 0;
          }
        }
        break;
      }

      case 'custom': {
        try {
          passed = !!rule.check(code);
        } catch {
          passed = false;
        }
        break;
      }

      default:
        passed = true;
    }

    if (!passed) {
      feedback.push(rule.message || 'Check this mission requirement!');
    }
  }

  return {
    passed: feedback.length === 0,
    feedback
  };
}

function completeLesson(state, lessonId, starsEarned = 3) {
  if (state.completedLessons.includes(lessonId)) {

  const updatedCompleted = [...state.completedLessons, lessonId];
  const updatedStars = state.stars + starsEarned;

  // Check for auto-unlocked badges
  const updatedBadges = [...state.badges];
  if (updatedCompleted.length >= 1 && !updatedBadges.includes('first-code')) {
    updatedBadges.push('first-code');
  }
  if (updatedCompleted.length >= 5 && !updatedBadges.includes('apprentice')) {
    updatedBadges.push('apprentice');
  }
  if (updatedCompleted.length >= 10 && !updatedBadges.includes('master-crafter')) {
    updatedBadges.push('master-crafter');
  }

  return {
    ...state,
    completedLessons: updatedCompleted,
    stars: updatedStars,
    badges: updatedBadges
  };
}

function isLessonCompleted(state, lessonId) {
  return state.completedLessons.includes(lessonId);
}

function getTotalStars(state) {
  return state.stars;
}

function unlockBadge(state, badgeId) {
  if (state.badges.includes(badgeId)) {
    return state;
  }
  return {
    ...state,
    badges: [...state.badges, badgeId]
  };
}

function toggleTeacherMode(state) {
  return {
    ...state,
    teacherMode: !state.teacherMode
  };
}

function toggleAudio(state) {
  return {
    ...state,
    audioEnabled: !state.audioEnabled
  };
}

function setTheme(state, theme) {
  return {
    ...state,
    theme
  };
}

function setStudentProfile(state, { name, avatar }) {
  return {
    ...state,
    studentName: name ?? state.studentName,
    studentAvatar: avatar ?? state.studentAvatar
  };
}

function saveStateToStorage(state, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.setItem) {
      store.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  } catch (e) {
    console.warn('Could not save state to storage:', e);
  }
}

function loadStateFromStorage(storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.getItem) {
      const data = store.getItem(STORAGE_KEY);
      if (data) {
        return {
          ...createInitialState(),
          ...JSON.parse(data)
        };
      }
    }
  } catch (e) {
    console.warn('Could not load state from storage:', e);
  }
  return createInitialState();
}


  // --- Audio Module ---
  /**
 * Audio Synthesizer Module
 * Uses Web Audio API to create joyful retro game sound effects.
 * 100% offline, zero audio assets required!
 */

let audioCtx = null;

function getAudioContext() {
  if (typeof window === 'undefined') return null;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type = 'click', isEnabled = true) {
  if (!isEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    switch (type) {
      case 'click': {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
        break;
      }

      case 'star': {
        // High sparkling bell chime
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + (i * 0.06);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.12, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
        break;
      }

      case 'success': {
        // Joyful fanfare: C - E - G - high C
        const notes = [
          { f: 523.25, d: 0.1 },  // C5
          { f: 659.25, d: 0.1 },  // E5
          { f: 783.99, d: 0.12 }, // G5
          { f: 1046.5, d: 0.35 }  // C6
        ];
        let offset = 0;
        notes.forEach(({ f, d }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + offset;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + d);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + d + 0.05);

          offset += d * 0.85;
        });
        break;
      }

      case 'tryAgain': {
        // Playful cartoon "boing"
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
        break;
      }

      case 'badge': {
        // Power-up ascending flourish
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
        break;
      }
    }
  } catch (e) {
    console.debug('Audio error:', e);
  }
}


  // --- Confetti Module ---
  /**
 * Confetti Celebration Engine
 * Renders colorful stars, confetti ribbons, and sparkles on canvas.
 */

function triggerConfetti(canvasElement) {
  if (!canvasElement) return;

  const ctx = canvasElement.getContext('2d');
  if (!ctx) return;

  const width = (canvasElement.width = window.innerWidth);
  const height = (canvasElement.height = window.innerHeight);

  const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#e056fd', '#00d2d3'];
  const particles = [];
  const particleCount = 120;

  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: width / 2,
      y: height / 2 + 50,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 0.8) * 22,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 12,
      opacity: 1,
      shape: Math.random() > 0.4 ? 'rect' : 'star'
    });
  }

  let animationFrameId;

  function render() {
    ctx.clearRect(0, 0, width, height);

    let activeCount = 0;

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45; // gravity
      p.vx *= 0.98; // air resistance
      p.rotation += p.vRot;
      p.opacity -= 0.009; // fade out

      if (p.opacity > 0 && p.y < height + 50) {
        activeCount++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.6);
        } else {
          // Draw mini star
          ctx.beginPath();
          for (let s = 0; s < 5; s++) {
            ctx.lineTo(
              Math.cos(((18 + s * 72) * Math.PI) / 180) * p.size,
              -Math.sin(((18 + s * 72) * Math.PI) / 180) * p.size
            );
            ctx.lineTo(
              Math.cos(((54 + s * 72) * Math.PI) / 180) * (p.size / 2),
              -Math.sin(((54 + s * 72) * Math.PI) / 180) * (p.size / 2)
            );
          }
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }
    }

    if (activeCount > 0) {
      animationFrameId = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, width, height);
      cancelAnimationFrame(animationFrameId);
    }
  }

  render();
}


  // --- Speech Module ---
  /**
 * Speech Narrator Module
 * Uses Web Speech API to read lessons and challenge missions aloud to kids.
 */

let currentUtterance = null;

function speakText(text, onEndCallback = null) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    console.warn('Speech synthesis not supported in this environment');
    return;
  }

  // Stop any ongoing speech
  window.speechSynthesis.cancel();

  if (!text) return;

  // Clean HTML tags or formatting
  const plainText = text.replace(/<[^>]+>/g, '').replace(/[#*`_]/g, '');

  const utterance = new SpeechSynthesisUtterance(plainText);
  utterance.rate = 0.95; // slightly slower, clear for kids
  utterance.pitch = 1.1; // friendly, upbeat

  // Pick a friendly English voice if available
  const voices = window.speechSynthesis.getVoices();
  const friendlyVoice = voices.find(
    v => (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Zira')) && v.lang.startsWith('en')
  ) || voices.find(v => v.lang.startsWith('en'));

  if (friendlyVoice) {
    utterance.voice = friendlyVoice;
  }

  utterance.onend = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  utterance.onerror = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    currentUtterance = null;
  }
}

function isSpeaking() {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return false;
  return window.speechSynthesis.speaking;
}

    codeEl.textContent = `.parent-container {\n  display: flex;\n  justify-content: ${justify};\n  align-items: ${align};\n  flex-direction: ${direction};\n  gap: ${gap};\n}`;
  }

  function handlePillGroup(groupId, onChange) {
    const pills = container.querySelectorAll(`#${groupId} .btn-pill`);
    pills.forEach(btn => {
      btn.addEventListener('click', () => {
        pills.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        onChange(btn.getAttribute('data-val'));
        update();
      });
    });
  }

  handlePillGroup('group-justify', val => { justify = val; });
  handlePillGroup('group-align', val => { align = val; });
  handlePillGroup('group-dir', val => { direction = val; });

  sGap.addEventListener('input', () => {
    gap = `${sGap.value}px`;
    vGap.textContent = gap;
    update();
  });

  btnCopy.addEventListener('click', () => {
    navigator.clipboard?.writeText(codeEl.textContent);
    btnCopy.textContent = '✅ Copied!';
    setTimeout(() => {
      btnCopy.textContent = '📋 Copy CSS';
    }, 1500);
  });

  update();
}

function initApp() {

function cacheElements() {
  elements.app = document.body;

function attachGlobalListeners() {
  // Audio toggle
  elements.btnAudio?.addEventListener('click', () => {
    state.audioEnabled = !state.audioEnabled;
    saveStateToStorage(state);
    elements.btnAudio.textContent = state.audioEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    playSound('click', state.audioEnabled);
  });

  // Teacher Mode toggle
  elements.btnTeacher?.addEventListener('click', () => {
    state.teacherMode = !state.teacherMode;
    saveStateToStorage(state);
    elements.btnTeacher.classList.toggle('active', state.teacherMode);
    playSound('click', state.audioEnabled);
    renderLessonView();
  });

  // Theme toggle
  elements.btnTheme?.addEventListener('click', () => {
    const themes = ['candy', 'arcade', 'space'];
    const nextIdx = (themes.indexOf(state.theme) + 1) % themes.length;
    state = setTheme(state, themes[nextIdx]);
    saveStateToStorage(state);
    applyTheme();
    playSound('click', state.audioEnabled);
  });

  // Profile avatar/name modal trigger
  document.getElementById('student-badge-btn')?.addEventListener('click', openProfileModal);

  // Sandbox Mode trigger
  elements.btnSandbox?.addEventListener('click', () => {
    currentView = 'sandbox';
    playSound('click', state.audioEnabled);
    renderSandboxView();
  });

  // Labs dropdown trigger
  elements.btnLabs?.addEventListener('click', (e) => {
    e.stopPropagation();
    elements.labsDropdown?.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    elements.labsDropdown?.classList.remove('show');
  });

  document.getElementById('lab-opt-box')?.addEventListener('click', () => {
    currentView = 'lab-box';
    playSound('click', state.audioEnabled);
    renderLabView('box');
  });

  document.getElementById('lab-opt-flex')?.addEventListener('click', () => {
    currentView = 'lab-flex';
    playSound('click', state.audioEnabled);
    renderLabView('flex');
  });

  document.getElementById('lab-opt-color')?.addEventListener('click', () => {
    currentView = 'lab-color';
    playSound('click', state.audioEnabled);
    renderLabView('color');
  });

  // Brand click -> Return to lessons
  document.querySelector('.brand')?.addEventListener('click', () => {
    currentView = 'lesson';
    playSound('click', state.audioEnabled);
    renderLessonView();
  });
}

function applyTheme() {
  elements.app.setAttribute('data-theme', state.theme);
  const themeLabels = {
    candy: '🍬 Theme: Candy',
    arcade: '🕹️ Theme: Arcade',
    space: '🌌 Theme: Space'
  };
  if (elements.btnTheme) {
    elements.btnTheme.textContent = themeLabels[state.theme] || '🎨 Theme';
  }
}

function applyStateToUI() {
  applyTheme();
  if (elements.studentName) elements.studentName.textContent = state.studentName;
  if (elements.studentAvatar) elements.studentAvatar.textContent = state.studentAvatar;
  if (elements.starCount) elements.starCount.textContent = `⭐ ${state.stars}`;
  if (elements.btnTeacher) elements.btnTeacher.classList.toggle('active', state.teacherMode);
  if (elements.btnAudio) elements.btnAudio.textContent = state.audioEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
  updateProgressUI();
  renderSidebar();
}

function updateProgressUI() {
  const total = LESSONS.length;
  const completed = state.completedLessons.length;
  const percent = Math.round((completed / total) * 100);

  if (elements.progressFill) elements.progressFill.style.width = `${percent}%`;
  if (elements.progressText) elements.progressText.textContent = `${completed} / ${total} Finished (${percent}%)`;
}

function renderSidebar() {
  if (!elements.sidebarLessonList) return;

  let html = '';
  MODULES.forEach(mod => {
    html += `<div class="nav-section-title">${mod.title}</div>`;
    const modLessons = LESSONS.filter(l => l.module === mod.id);
    html += `<ul class="lesson-list">`;
    modLessons.forEach(lesson => {
      const isCompleted = isLessonCompleted(state, lesson.id);
      const isActive = currentView === 'lesson' && state.currentLessonId === lesson.id;
      html += `
        <li class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" data-lesson-id="${lesson.id}">
          <span class="lesson-item-icon">${lesson.icon}</span>
          <span class="lesson-item-text">${lesson.title}</span>
        </li>
      `;
    });
    html += `</ul>`;
  });

  elements.sidebarLessonList.innerHTML = html;

  // Attach click listeners to sidebar items
  const items = elements.sidebarLessonList.querySelectorAll('.lesson-item');
  items.forEach(item => {
    item.addEventListener('click', () => {
      const lessonId = item.getAttribute('data-lesson-id');
      currentView = 'lesson';
      playSound('click', state.audioEnabled);
      selectLesson(lessonId);
    });
  });
}

function selectLesson(lessonId) {
  const lesson = getLessonById(lessonId) || LESSONS[0];
  state.currentLessonId = lesson.id;
  currentCode = lesson.initialCode;
  saveStateToStorage(state);

  renderSidebar();
  renderLessonView();
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setupLessonListeners(lesson) {
  const textarea = document.getElementById('code-textarea');
  const lineNumbers = document.getElementById('line-numbers');

  // Input & Code updates
  textarea?.addEventListener('input', () => {
    currentCode = textarea.value;
    updateLivePreview();
    updateLineNumbers();
  });

  // Tab key indent support
  textarea?.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      currentCode = textarea.value;
      updateLivePreview();
      updateLineNumbers();
    }
  });

  // Quick Tag insert chips
  const tagChips = document.querySelectorAll('.tag-chip');
  tagChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const tag = chip.getAttribute('data-tag');
      insertTextAtCursor(textarea, tag);
      playSound('click', state.audioEnabled);
    });
  });

  // Reset Button
  document.getElementById('btn-reset-code')?.addEventListener('click', () => {
    if (confirm('Reset your code back to the starting example?')) {
      textarea.value = lesson.initialCode;
      currentCode = lesson.initialCode;
      updateLivePreview();
      updateLineNumbers();
      playSound('click', state.audioEnabled);
    }
  });

  // Copy Button
  document.getElementById('btn-copy-code')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(textarea.value);
    const btn = document.getElementById('btn-copy-code');
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500);
  });

  // Format Code Button
  document.getElementById('btn-format-code')?.addEventListener('click', () => {
    textarea.value = tidyHtml(textarea.value);
    currentCode = textarea.value;
    updateLivePreview();
    updateLineNumbers();
    playSound('click', state.audioEnabled);
  });

  // Read Aloud Button
  const btnRead = document.getElementById('btn-read-aloud');
  btnRead?.addEventListener('click', () => {
    if (isSpeaking()) {
      stopSpeaking();
      btnRead.textContent = '🔊 Read Aloud';
    } else {
      btnRead.textContent = '⏹️ Stop Voice';
      speakText(`${lesson.title}. ${lesson.summary}. ${lesson.story}. Mission: ${lesson.challenge.mission}`, () => {
        btnRead.textContent = '🔊 Read Aloud';
      });
    }
  });

  // Teacher Box Toggle
  document.getElementById('btn-toggle-teacher-box')?.addEventListener('click', () => {
    const box = document.getElementById('teacher-playbook-box');
    const isVisible = box.style.display !== 'none';
    box.style.display = isVisible ? 'none' : 'block';
  });

  // Preview Tabs: Live vs Target Goal vs Side-by-Side
  setupPreviewTabs(lesson);

  // Hint Button
  document.getElementById('btn-hint')?.addEventListener('click', () => {
    playSound('click', state.audioEnabled);
    alert(`💡 MISSION HINT:\n\n${lesson.challenge.hint}`);
  });

  // Check My Code Button
  document.getElementById('btn-verify-mission')?.addEventListener('click', () => {
    handleChallengeVerification(lesson);
  });
}

function insertTextAtCursor(textarea, text) {
  if (!textarea) return;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
  textarea.selectionStart = textarea.selectionEnd = start + text.length;
  textarea.focus();
  currentCode = textarea.value;
  updateLivePreview();
  updateLineNumbers();
}

function updateLineNumbers() {
  const textarea = document.getElementById('code-textarea');
  const lineNumbers = document.getElementById('line-numbers');
  if (!textarea || !lineNumbers) return;

  const lines = textarea.value.split('\n').length;
  let numbersHtml = '';
  for (let i = 1; i <= Math.max(lines, 1); i++) {
    numbersHtml += `${i}<br>`;
  }
  lineNumbers.innerHTML = numbersHtml;
}

function updateLivePreview() {
  const iframe = document.getElementById('live-iframe');
  if (!iframe) return;

  // Use srcdoc for 100% reliable local file:// execution without cross-origin errors
  iframe.srcdoc = currentCode;
}

        <div style="display: flex; flex-direction: column;">
          <div style="background: #eef2f7; padding: 6px 12px; font-size: 11px; font-weight: 800; color: #475569;">TARGET GOAL</div>
          <iframe id="target-iframe" class="preview-iframe" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
    `;
    updateLivePreview();
    const targetIframe = document.getElementById('target-iframe');
    if (targetIframe) {
      targetIframe.srcdoc = lesson.targetCode;
    }
    playSound('click', state.audioEnabled);
  });
}

function handleChallengeVerification(lesson) {
  const result = validateChallenge(currentCode, lesson.challenge.rules);

  if (result.passed) {
    playSound('success', state.audioEnabled);
    triggerConfetti(elements.confettiCanvas);

    // Update state with completion and award stars
    const previousCompleted = isLessonCompleted(state, lesson.id);
    state = completeLesson(state, lesson.id, 3);
    saveStateToStorage(state);
    applyStateToUI();

    showCelebrationModal(lesson, previousCompleted);
  } else {
    playSound('tryAgain', state.audioEnabled);
    showTryAgainModal(result.feedback);
  }
}

function showCelebrationModal(lesson, wasAlreadyCompleted) {
  const currentIdx = LESSONS.findIndex(l => l.id === lesson.id);
  const nextLesson = LESSONS[currentIdx + 1];

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon">🎉</div>
      <h3 class="modal-title">MISSION COMPLETE!</h3>
      <div class="modal-body">
        <p>Awesome job, <strong>${state.studentName}</strong>! You mastered <strong>${lesson.title}</strong>!</p>
        <p style="margin-top: 10px; font-size: 16px; color: #f59f00; font-weight: 800;">
          ${wasAlreadyCompleted ? '⭐ Mission verified again!' : '+3 STARS EARNED! ⭐⭐⭐'}
        </p>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-close" class="btn-modal btn-modal-secondary">Stay Here & Play</button>
        ${nextLesson ? `<button id="btn-modal-next" class="btn-modal btn-modal-primary">Next Quest ➡️</button>` : ''}
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector('#btn-modal-close')?.addEventListener('click', () => {
    modal.remove();
  });

  modal.querySelector('#btn-modal-next')?.addEventListener('click', () => {
    modal.remove();
    if (nextLesson) {
      selectLesson(nextLesson.id);
    }
  });
}

function showTryAgainModal(feedback) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon">🧐</div>
      <h3 class="modal-title" style="color: #ff4757;">Almost There!</h3>
      <div class="modal-body">
        <p>Your code is so close! Here is what your robot needs:</p>
        <div style="background: #ffe3e3; border-radius: 8px; padding: 12px; margin-top: 10px; color: #c92a2a; text-align: left; font-weight: bold;">
          ${feedback.map(f => `<div>• ${f}</div>`).join('')}
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-retry" class="btn-modal btn-modal-primary">Let Me Try Again! 💪</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector('#btn-modal-retry')?.addEventListener('click', () => {
    modal.remove();
  });
}

// ===================================================================
// Free Sandbox Scratchpad View
// ===================================================================
function renderSandboxView() {
  elements.workspaceStage.innerHTML = `
    <div class="lesson-banner">
      <div class="banner-main">
        <div class="banner-meta">
          <span class="badge-module" style="background: #ffd32a; color: #1e272e;">CREATIVE MODE</span>
        </div>
        <h2 class="banner-title">🚀 Free Coding Sandbox</h2>
        <p class="banner-summary">Build anything you can imagine! Pick a starter template or start from scratch, then download your real website file!</p>
      </div>
      <div class="banner-controls">
        <button id="btn-download-html" class="btn-pill-action active" style="background: #2ed573; border-color: #2ed573;">
          💾 Download My Website (.html)
        </button>
      </div>
    </div>

    <!-- Template Selector Bar -->
    <div style="background: var(--bg-card); border-bottom: 2px solid var(--border-color); padding: 12px 28px; display: flex; align-items: center; gap: 12px; overflow-x: auto;">
      <span style="font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); white-space: nowrap;">Starter Templates:</span>
      ${TEMPLATES.map(t => `<button class="btn-pill btn-tpl" data-tpl="${t.id}">${t.name}</button>`).join('')}
    </div>

    <!-- Sandbox Split View -->
    <div class="editor-stage-split">
      <div class="pane-card">
        <div class="pane-header">
          <div class="pane-title"><span>💻</span> Sandbox Code</div>
          <div class="pane-tools">
            <button id="btn-sb-format" class="btn-tool">🪄 Tidy</button>
            <button id="btn-sb-copy" class="btn-tool">📋 Copy</button>
          </div>
        </div>
        <div class="code-editor-wrapper">
          <div id="sb-line-numbers" class="editor-line-numbers">1</div>
          <textarea id="sb-textarea" class="code-textarea" spellcheck="false">${state.customSandboxCode}</textarea>
        </div>
      </div>

      <div class="pane-card">
        <div class="pane-header">
          <div class="pane-title"><span>👁️</span> Live Webpage Preview</div>
        </div>
        <div class="preview-wrapper">
          <iframe id="sb-iframe" class="preview-iframe" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
    </div>
  `;

  const textarea = document.getElementById('sb-textarea');
  const iframe = document.getElementById('sb-iframe');
  const lineNumbers = document.getElementById('sb-line-numbers');

  function updateSbPreview() {
    iframe.srcdoc = textarea.value;

    // Update lines
    const lines = textarea.value.split('\n').length;
    let numHtml = '';
    for (let i = 1; i <= Math.max(lines, 1); i++) numHtml += `${i}<br>`;
    lineNumbers.innerHTML = numHtml;

    // Auto save
    state.customSandboxCode = textarea.value;
    saveStateToStorage(state);
  }

  textarea.addEventListener('input', updateSbPreview);
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      updateSbPreview();
    }
  });

  const tplBtns = document.querySelectorAll('.btn-tpl');
  tplBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tplId = btn.getAttribute('data-tpl');
      const tpl = TEMPLATES.find(t => t.id === tplId);
      if (tpl && confirm(`Load the ${tpl.name} template?`)) {
        textarea.value = tpl.code;
        updateSbPreview();
        playSound('click', state.audioEnabled);
      }
    });
  });

  document.getElementById('btn-download-html')?.addEventListener('click', () => {
    downloadHtmlFile('my-awesome-site.html', textarea.value);
    playSound('badge', state.audioEnabled);
  });

  document.getElementById('btn-sb-copy')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(textarea.value);
    const btn = document.getElementById('btn-sb-copy');
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500);
  });

  document.getElementById('btn-sb-format')?.addEventListener('click', () => {
    textarea.value = tidyHtml(textarea.value);
    updateSbPreview();
    playSound('click', state.audioEnabled);
  });

  updateSbPreview();
}

function tidyHtml(html) {
  let formatted = '';
  let indent = 0;
  const lines = html.replace(/>\s*</g, '>\n<').split('\n');

  lines.forEach(line => {
    line = line.trim();
    if (!line) return;

    if (line.match(/^<\/\w/) || line.match(/^<\/style>/)) {
      indent = Math.max(0, indent - 1);
    }

    formatted += '  '.repeat(indent) + line + '\n';

    if (
      line.match(/^<[a-z0-9]+/i) &&
      !line.match(/^<(img|input|br|hr|meta|link)/i) &&
      !line.match(/<\/[a-z0-9]+>/i) &&
      !line.endsWith('/>')
    ) {
      indent++;
    }
  });

  return formatted.trim();
}
