<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraft 👾 HTML & CSS for Kids (English)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

  <!-- Google Fonts: Outfit for clean legibility, Fira Code for code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
/* Inlined Stylesheet */
/* ===================================================================
   CodeCraft Kids: Calm Dark Theme & Minimalist Design
   Easy on the eyes, zero visual clutter, focused on bite-sized learning.
   =================================================================== */

:root {
  --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;

  /* Eye-friendly Calm Slate Theme (Soft Midnight, Zero Glare) */
  --bg-app: #0b0d13;
  --bg-sidebar: #0f121a;
  --bg-card: #141722;
  --bg-surface: #1a1f2e;
  --bg-code: #080a0f;
  
  --text-main: #cbd5e1;
  --text-muted: #788699;
  --text-code: #e2e8f0;

  --primary: #5b5fc7;
  --primary-hover: #4e52b3;
  --primary-light: rgba(91, 95, 199, 0.12);
  
  --accent-teal: #14b8a6;
  --accent-pink: #ec4899;
  --accent-amber: #eab308;
  --accent-green: #22c55e;
  --accent-red: #ef4444;

  --border-color: #1e2433;
  --border-focus: #5b5fc7;

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.6);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  --header-height: 54px;
}

/* Deep OLED Pure Black Mode */
[data-theme="oled"] {
  --bg-app: #000000;
  --bg-sidebar: #050608;
  --bg-card: #0a0c10;
  --bg-surface: #10131a;
  --bg-code: #000000;
  --border-color: #161a24;
  --text-main: #b8c2cc;
  --text-muted: #64748b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-app);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  line-height: 1.5;
}

/* ===================================================================
   Streamlined, Clean Header (Zero Clutter)
   =================================================================== */
.app-header {
  height: var(--header-height);
  background-color: var(--bg-sidebar);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}

.brand-icon {
  font-size: 26px;
}

.brand-text h1 {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.3px;
}

.brand-text span {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background-color: rgba(251, 191, 36, 0.12);
  color: var(--accent-amber);
  border: 1px solid rgba(251, 191, 36, 0.25);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-weight: 800;
  font-size: 13px;
}

.btn-header {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-icon-only {
  padding: 6px 10px;
  font-size: 14px;
}

.btn-link-tags {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--accent-teal);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}

.btn-link-tags:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: #ffffff;
}

/* Dual Language Segmented Control */
.lang-switcher {
  display: flex;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 2px;
  gap: 2px;
}

.lang-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.lang-tab:hover {
  color: var(--text-main);
}

.lang-tab.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(91, 95, 199, 0.4);
}

.btn-header:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

.btn-header.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

/* ===================================================================
   Main Layout: Sidebar + Workspace
   =================================================================== */
.app-layout {
  display: flex;
  flex: 1;
  height: calc(100vh - var(--header-height));
  overflow: hidden;
}

.app-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  user-select: none;
}

.sidebar-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.progress-track {
  height: 6px;
  background-color: var(--bg-surface);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-teal), var(--primary));
  width: 0%;
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}

.nav-section-title {
  padding: 14px 18px 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
}

.lesson-list {
  list-style: none;
  padding: 0 8px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin-bottom: 3px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  position: relative;
}

.lesson-item:hover {
  background-color: var(--bg-surface);
}

.lesson-item.active {
  background-color: var(--primary);
  color: #ffffff;
}

.lesson-item.completed::after {
  content: '⭐';
  position: absolute;
  right: 10px;
  font-size: 12px;
}

.lesson-item-icon {
  font-size: 16px;
}

.lesson-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===================================================================
   Workspace Content Stage
   =================================================================== */
.workspace-stage {
  flex: 1;
  min-width: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background-color: var(--bg-app);
}

.lesson-banner {
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.banner-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.badge-module {
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.badge-tags {
  font-family: var(--font-code);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--accent-pink);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

.banner-title {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.banner-summary {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 2px;
}

/* ===================================================================
   Human Intro Card (Plain explanation for kids)
   =================================================================== */
.human-intro-card {
  margin: 14px 24px 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}

.human-intro-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}

.human-intro-item h4 {
  font-size: 13px;
  font-weight: 800;
  color: var(--accent-teal);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.human-intro-item p {
  font-size: 13px;
  color: var(--text-main);
  line-height: 1.5;
}

/* ===================================================================
   Tag Showcase Bar (Simple tags gallery: <b>, <i>, <u>, etc.)
   =================================================================== */
.tag-showcase-bar {
  margin: 12px 24px 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow-x: auto;
}

.showcase-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent-amber);
  white-space: nowrap;
}

.showcase-chips {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.showcase-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.showcase-chip code {
  font-family: var(--font-code);
  font-weight: 700;
  color: var(--accent-teal);
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 4px;
}

.showcase-chip span {
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
}

.inline-code {
  font-family: var(--font-code);
  background: rgba(124, 108, 247, 0.15);
  color: var(--accent-teal);
  border: 1px solid rgba(124, 108, 247, 0.3);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.88em;
  font-weight: 600;
  vertical-align: baseline;
}

/* ===================================================================
   STEP-BY-STEP CODE BREAKDOWN (What Each Specific Piece Does)
   =================================================================== */
.step-breakdown-card {
  margin: 14px 24px 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}

.step-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.step-header-text {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-card-header h3 {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-main);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.step-count-pill {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

.step-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}

.step-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s;
}

.step-item:hover {
  border-color: var(--primary);
}

.step-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.step-num-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-amber);
  background: rgba(234, 179, 8, 0.12);
  border: 1px solid rgba(234, 179, 8, 0.25);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}

.step-role-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--primary);
  background: var(--primary-light);
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.step-code-focus {
  display: flex;
  align-items: center;
}

.step-code-chip {
  font-family: var(--font-code);
  font-size: 13px;
  font-weight: 700;
  color: #38bdf8;
  background: var(--bg-code);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  word-break: break-all;
}

.step-explanation {
  font-size: 12.5px;
  color: var(--text-main);
  line-height: 1.45;
}

.step-result-box {
  background: var(--bg-code);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.step-result-heading {
  font-size: 11.5px;
  color: var(--accent-teal);
  display: flex;
  align-items: flex-start;
  gap: 5px;
  line-height: 1.35;
}

.step-visual-render {
  background: rgba(255, 255, 255, 0.02);
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  font-size: 12px;
  color: var(--text-main);
}

.mini-canvas {
  width: 100%;
  text-align: center;
  font-size: 12.5px;
}

/* ===================================================================
   Teacher & Parent Playbook (Shown when toggled)
   =================================================================== */
.teacher-playbook {
  background: #1e1b13;
  border: 1px solid #785210;
  border-radius: var(--radius-md);
  margin: 12px 24px 0;
  padding: 14px 18px;
  color: #fde047;
}

.teacher-playbook h4 {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.teacher-playbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  font-size: 12px;
  color: #fef08a;
}

.teacher-item strong {
  display: block;
  color: #fb923c;
  margin-bottom: 2px;
}

/* ===================================================================
   Editor & Dual Preview Split
   =================================================================== */
.editor-stage-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 24px;
  flex: 1;
}

.pane-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.pane-header {
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.pane-title {
  font-size: 13px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 6px;
}

.pane-tools {
  display: flex;
  gap: 6px;
}

.btn-tool {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-tool:hover {
  background: var(--bg-surface);
  color: var(--text-main);
  border-color: var(--primary);
}

/* Quick Tags Toolbar */
.quick-tags-bar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
}

.quick-tag-label {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.tag-chip {
  font-family: var(--font-code);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--accent-teal);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.tag-chip:hover {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

/* Code Editor Textarea */
.code-editor-wrapper {
  flex: 1;
  position: relative;
  background: var(--bg-code);
  display: flex;
  min-height: 280px;
}

.editor-line-numbers {
  width: 36px;
  background: rgba(0, 0, 0, 0.25);
  color: #64748b;
  font-family: var(--font-code);
  font-size: 12px;
  line-height: 22px;
  padding: 12px 6px;
  text-align: right;
  user-select: none;
  border-right: 1px solid var(--border-color);
}

.code-textarea {
  flex: 1;
  background: transparent;
  color: var(--text-code);
  font-family: var(--font-code);
  font-size: 13px;
  line-height: 22px;
  padding: 12px 14px;
  border: none;
  outline: none;
  resize: none;
  white-space: pre;
  tab-size: 2;
}

/* Right Pane: Preview Tabs */
.preview-tabs {
  display: flex;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.prev-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}

.prev-tab-btn.active {
  background: var(--bg-surface);
  color: #ffffff;
}

.preview-wrapper {
  flex: 1;
  position: relative;
  min-height: 280px;
  background: var(--bg-code);
  display: flex;
}

.preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: var(--bg-code);
  color: var(--text-main);
}

.target-view-container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.target-explanation-box {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-main);
}

.target-explanation-box strong {
  color: var(--accent-amber);
}

/* ===================================================================
   HIGH-VISIBILITY MISSION SPOTLIGHT (Directly Above Code Editor)
   =================================================================== */
.mission-spotlight-card {
  margin: 16px 24px 0;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(91, 95, 199, 0.16));
  border: 2px solid #f59e0b;
  border-radius: var(--radius-lg);
  padding: 18px 22px;
  box-shadow: 0 4px 24px rgba(245, 158, 11, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.mission-spotlight-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.mission-spotlight-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(245, 158, 11, 0.24);
  border: 1px solid #f59e0b;
  color: #fbbf24;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.8px;
}

.mission-pulse-dot {
  width: 9px;
  height: 9px;
  background: #f59e0b;
  border-radius: 50%;
  box-shadow: 0 0 10px #f59e0b;
  animation: pulseMission 1.5s infinite;
}

@keyframes pulseMission {
  0% { transform: scale(0.9); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #fbbf24; }
  100% { transform: scale(0.9); opacity: 0.7; }
}

.mission-quick-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-mission-hint {
  background: var(--bg-surface);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fbbf24;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-mission-hint:hover {
  background: rgba(245, 158, 11, 0.2);
  border-color: #f59e0b;
  color: #ffffff;
}

.btn-mission-verify {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #0b0d13;
  border: none;
  padding: 9px 22px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
  transition: all 0.15s;
}

.btn-mission-verify:hover {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
}

.mission-spotlight-body {
  background: rgba(11, 13, 19, 0.75);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}

.mission-spotlight-text {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.55;
  letter-spacing: 0.2px;
}

/* ===================================================================
   Mission Dock (Bottom Action Bar)
   =================================================================== */
.mission-dock {
  background: var(--bg-card);
  border-top: 1px solid var(--border-color);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  bottom: 0;
  z-index: 90;
}

.mission-tag {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent-pink);
  margin-bottom: 2px;
}

.mission-text {
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
}

.mission-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-hint {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.btn-hint:hover {
  color: var(--accent-amber);
  border-color: var(--accent-amber);
}

.btn-verify {
  background: var(--primary);
  color: #ffffff;
  border: none;
  padding: 9px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-verify:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

/* ===================================================================
   List of Tags Modal
   =================================================================== */
.tag-list-modal-card {
  max-width: 650px;
  width: 95%;
  text-align: left;
}

.tag-list-table-wrapper {
  max-height: 400px;
  overflow-y: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
}

.tag-list-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.tag-list-table th {
  background: var(--bg-surface);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
}

.tag-list-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
}

.tag-list-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

.tag-code-pill {
  font-family: var(--font-code);
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-teal);
  background: var(--bg-code);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(45, 212, 191, 0.25);
  cursor: pointer;
  display: inline-block;
  transition: all 0.15s;
}

.tag-code-pill:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: #ffffff;
}

/* ===================================================================
   Modals & Overlays
   =================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(3px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  max-width: 440px;
  width: 90%;
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.modal-icon {
  font-size: 48px;
  margin-bottom: 8px;
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 6px;
}

.modal-body {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.modal-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.btn-modal {
  padding: 8px 18px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border: none;
}

.btn-modal-primary {
  background: var(--primary);
  color: #ffffff;
}

.btn-modal-secondary {
  background: var(--bg-surface);
  color: var(--text-main);
  border: 1px solid var(--border-color);
}

#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}

@media (max-width: 1024px) {
  .editor-stage-split {
    grid-template-columns: 1fr;
  }
  .app-sidebar {
    width: 240px;
  }
  .lab-grid {
    grid-template-columns: 1fr;
  }
}

/* ===================================================================
   Quick Tag Insertion Bar above code editor
   =================================================================== */
.editor-quick-tags-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  overflow-x: auto;
  scrollbar-width: thin;
}

.quick-tags-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  white-space: nowrap;
}

.quick-tags-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}

.tag-insert-chip {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--accent-cyan);
  font-family: var(--font-code);
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
  user-select: none;
}

.tag-insert-chip:hover {
  background: rgba(91, 95, 199, 0.2);
  border-color: var(--primary);
  color: #ffffff;
  transform: translateY(-1px);
}

.tag-insert-chip:active {
  transform: translateY(1px);
}

/* ===================================================================
   Read Aloud Speech Button in Mission Spotlight Card
   =================================================================== */
.btn-mission-read {
  background: rgba(45, 212, 191, 0.12);
  color: var(--accent-cyan);
  border: 1px solid rgba(45, 212, 191, 0.3);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}

.btn-mission-read:hover {
  background: rgba(45, 212, 191, 0.22);
  border-color: var(--accent-cyan);
  color: #ffffff;
}

.btn-mission-read.speaking {
  background: #ff5e7e;
  color: #ffffff;
  border-color: #ff5e7e;
  animation: pulse-read 1s infinite alternate;
}

@keyframes pulse-read {
  0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 94, 126, 0.4); }
  100% { transform: scale(1.04); box-shadow: 0 0 12px rgba(255, 94, 126, 0.6); }
}

/* ===================================================================
   Visual Labs View Styles (Box Model, Flexbox, Color, Grid)
   =================================================================== */
.labs-view-wrapper {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
}

.labs-nav-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  overflow-x: auto;
}

.labs-tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.labs-tab-btn:hover {
  color: var(--text-main);
  border-color: var(--primary);
}

.labs-tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(91, 95, 199, 0.35);
}

.lab-container {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.lab-header {
  margin-bottom: 20px;
}

.lab-header h3 {
  font-size: 20px;
  font-weight: 800;
  margin: 0 0 6px;
  color: var(--text-main);
}

.lab-header p {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

.lab-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 24px;
  align-items: start;
}

.lab-controls {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-group label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.dot-margin { background: #ff9f43; }
.dot-border { background: #fbc531; }
.dot-padding { background: #2ed573; }
.dot-radius { background: #00d2d3; }

.control-group input[type="range"] {
  width: 100%;
  accent-color: var(--primary);
  cursor: pointer;
}

.btn-pill-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.btn-pill {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-pill:hover {
  color: var(--text-main);
  border-color: var(--primary);
}

.btn-pill.active {
  background: rgba(91, 95, 199, 0.25);
  border-color: var(--primary);
  color: #ffffff;
}

.color-preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.preset-btn {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  cursor: pointer;
  transition: transform 0.15s ease;
}

.preset-btn:hover {
  transform: scale(1.05);
}

.color-input {
  width: 100%;
  height: 36px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  cursor: pointer;
}

.lab-code-output {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
}

.lab-code-output .code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
}

.lab-code-output pre {
  margin: 0;
  font-family: var(--font-code);
  font-size: 12px;
  color: var(--accent-cyan);
  white-space: pre-wrap;
  word-break: break-all;
}

.btn-sm {
  background: rgba(91, 95, 199, 0.2);
  border: 1px solid var(--primary);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.lab-stage {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 32px;
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Box Model Visual Layers */
.box-layer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: padding 0.1s ease;
}

.layer-margin {
  background: rgba(255, 159, 67, 0.15);
  border: 2px dashed #ff9f43;
}

.layer-border {
  background: rgba(251, 197, 49, 0.25);
  border: 2px solid #fbc531;
}

.layer-padding {
  background: rgba(46, 213, 115, 0.2);
  border: 2px dashed #2ed573;
}

.layer-content {
  background: #141722;
  border: 1px solid var(--border-color);
  padding: 24px 32px;
  border-radius: 8px;
  text-align: center;
  color: #ffffff;
}

.layer-tag {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.85;
}

.tag-margin { color: #ff9f43; }
.tag-border { color: #fbc531; }
.tag-padding { color: #2ed573; }
.tag-content { color: var(--text-muted); }

/* Flexbox Visual Stage */
.flex-stage {
  display: flex;
  width: 100%;
  min-height: 280px;
  background: #141722;
  border: 2px dashed var(--border-color);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s ease;
}

.flex-creature {
  padding: 16px 20px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 13px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  transition: all 0.2s ease;
}

.creature-icon {
  font-size: 32px;
}

/* Color Preview Card */
.color-preview-card {
  width: 320px;
  min-height: 240px;
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  transition: all 0.2s ease;
}

.color-card-badge {
  display: inline-block;
  align-self: flex-start;
  background: rgba(0,0,0,0.3);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: #ffffff;
}

.color-card-body h4 {
  font-size: 24px;
  margin: 12px 0 6px;
  color: #ffffff;
}

.color-card-body p {
  font-size: 13px;
  opacity: 0.9;
  margin: 0;
  color: #ffffff;
}

.color-card-button {
  background: #ffffff;
  color: #0b0d13;
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  margin-top: 16px;
}

/* CSS Grid Board */
.grid-board {
  width: 100%;
  max-width: 500px;
  transition: all 0.2s ease;
}

.grid-slot {
  background: #141722;
  border: 2px solid #5b5fc7;
  border-radius: 12px;
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.slot-icon {
  font-size: 32px;
}

.slot-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}


/* ===================================================================
   Dedicated Topic Visual Laboratories
   =================================================================== */
.btn-topic-lab {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(99, 102, 241, 0.25));
  border: 1px solid rgba(168, 85, 247, 0.5);
  color: #c084fc;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-topic-lab:hover {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.45), rgba(99, 102, 241, 0.45));
  border-color: #c084fc;
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
}

.topic-lab-modal-card {
  max-width: 1120px;
  width: 95vw;
  height: 86vh;
  max-height: 780px;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  text-align: left;
  border: 1px solid rgba(168, 85, 247, 0.45);
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 50px rgba(168, 85, 247, 0.25);
  background: var(--bg-card);
  border-radius: 16px;
}

.topic-lab-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
}

.topic-lab-modal-heading {
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
}

.btn-close-modal {
  font-size: 18px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
}

.btn-close-modal:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

.topic-lab-modal-body {
  padding: 16px 20px;
  overflow: hidden;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.topic-lab-modal-footer {
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-color);
}

.topic-lab-wrapper {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 16px;
  flex: 1;
  min-height: 0;
  height: 100%;
}

@media (max-width: 920px) {
  .topic-lab-modal-card {
    height: 94vh;
    max-height: none;
  }
  .topic-lab-wrapper {
    grid-template-columns: 1fr;
    overflow-y: auto;
  }
}

.topic-lab-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #0b0f19;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
}

.topic-lab-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(30, 41, 59, 0.7) 0%, #090d16 100%);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  height: 100%;
  min-height: 0;
  position: relative;
  overflow: auto;
}

.topic-lab-status {
  padding: 10px 14px;
  background: rgba(168, 85, 247, 0.12);
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.5;
  color: #e2e8f0;
}

/* ===================================================================
   Evolution Timeline Range Slider
   =================================================================== */
.evolution-slider-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
}

.slider-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.slider-title-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);

  // --- Validator Module ---
  /**
 * CodeCraft Challenge Validator
 * Evaluates whether student HTML/CSS code meets the learning objectives.
 */

function validateChallenge(code, rules = []) {
  if (!code || typeof code !== 'string') {
    return {
      passed: false,
      feedback: ['Write some code in the editor to start the challenge!']
    };
  }

  // Strip HTML comments so instructions inside comments don't trigger false passes
  const codeWithoutComments = code.replace(/<!--[\s\S]*?-->/g, '');
  const feedback = [];

  for (const rule of rules) {
    let passed = false;

    switch (rule.type) {
      case 'hasTag': {
        const tagRegex = new RegExp(`<\\s*${rule.tag}(\\s+[^>]*)?>`, 'i');
        passed = tagRegex.test(codeWithoutComments);
        break;
      }

      case 'hasAttribute': {
        // Looks for <tag ... attr="..." or attr='...' or attr>
        const attrRegex = new RegExp(`<\\s*${rule.tag}[^>]*\\s+${rule.attribute}(?:\\s*=\\s*["'][^"']*["'])?[^>]*>`, 'i');
        passed = attrRegex.test(codeWithoutComments);
        break;
      }

      case 'hasCssProperty': {
        // Check for style tag or inline style with property: value
        // Matches e.g. color: hotpink; or style="... color: hotpink ..."
        const escapedProp = rule.property.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const cssRegex = new RegExp(`${escapedProp}\\s*:\\s*([^;}"']+)`, 'gi');
        let match;
        while ((match = cssRegex.exec(codeWithoutComments)) !== null) {
          const val = match[1].trim();
          if (!rule.valuePattern) {
            passed = true;
            break;
          }
          if (rule.valuePattern instanceof RegExp && rule.valuePattern.test(val)) {
            passed = true;
            break;
          }
          if (typeof rule.valuePattern === 'string' && val.toLowerCase().includes(rule.valuePattern.toLowerCase())) {
            passed = true;
            break;
          }
        }
        break;
      }

      case 'tagContainsText': {
        // Matches <tag ...>content</tag>
        const tagContentRegex = new RegExp(`<\\s*${rule.tag}[^>]*>([\\s\\S]*?)<\\s*\\/\\s*${rule.tag}\\s*>`, 'i');
        const match = tagContentRegex.exec(codeWithoutComments);
        if (match) {
          const innerText = match[1].replace(/<[^>]+>/g, '').trim();
          if (rule.pattern instanceof RegExp) {
            passed = rule.pattern.test(innerText);
          } else if (typeof rule.pattern === 'string') {
            passed = innerText.toLowerCase().includes(rule.pattern.toLowerCase());
          } else {
            passed = innerText.length > 0;
          }
        }
        break;
      }

      case 'custom': {
        try {
          passed = !!rule.check(code);
        } catch {
          passed = false;
        }
        break;
      }

      default:
        passed = true;
    }

    if (!passed) {
      feedback.push(rule.message || 'Check this mission requirement!');
    }
  }

  return {
    passed: feedback.length === 0,
    feedback
  };
}

function completeLesson(state, lessonId, starsEarned = 3) {
  if (state.completedLessons.includes(lessonId)) {
    return state;
  }

  const updatedCompleted = [...state.completedLessons, lessonId];
  const updatedStars = state.stars + starsEarned;

  const updatedBadges = [...state.badges];
  if (updatedCompleted.length >= 1 && !updatedBadges.includes('first-code')) {
    updatedBadges.push('first-code');
  }
  if (updatedCompleted.length >= 5 && !updatedBadges.includes('apprentice')) {
    updatedBadges.push('apprentice');
  }
  if (updatedCompleted.length >= 10 && !updatedBadges.includes('master-crafter')) {
    updatedBadges.push('master-crafter');
  }

  return {
    ...state,
    completedLessons: updatedCompleted,
    stars: updatedStars,
    badges: updatedBadges
  };
}

function isLessonCompleted(state, lessonId) {
  return state.completedLessons.includes(lessonId);
}

function getTotalStars(state) {
  return state.stars;
}

function unlockBadge(state, badgeId) {
  if (state.badges.includes(badgeId)) {
    return state;
  }
  return {
    ...state,
    badges: [...state.badges, badgeId]
  };
}

function toggleTeacherMode(state) {
  return {
    ...state,
    teacherMode: !state.teacherMode
  };
}

function toggleAudio(state) {
  return {
    ...state,
    audioEnabled: !state.audioEnabled
  };
}

function toggleLanguage(state) {
  const nextLang = state.lang === 'uz' ? 'en' : 'uz';
  return {
    ...state,
    lang: nextLang
  };
}

function setLanguage(state, lang) {
  return {
    ...state,
    lang: lang === 'uz' ? 'uz' : 'en'
  };
}

function setTheme(state, theme) {
  return {
    ...state,

  };
}

function setStudentProfile(state, { name, avatar }) {
  return {
    ...state,
    studentName: name ?? state.studentName,
    studentAvatar: avatar ?? state.studentAvatar
  };
}

function saveStateToStorage(state, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.setItem) {
      store.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  } catch (e) {
    console.warn('Could not save state to storage:', e);
  }
}

function loadStateFromStorage(storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.getItem) {
      const data = store.getItem(STORAGE_KEY);
      if (data) {
        return {
          ...createInitialState(),
          ...JSON.parse(data)
        };
      }
    }
  } catch (e) {
    console.warn('Could not load state from storage:', e);
  }
  return createInitialState();
}


  // --- Audio Module ---
  /**
 * Audio Synthesizer Module
 * Uses Web Audio API to create joyful retro game sound effects.
 * 100% offline, zero audio assets required!
 */

let audioCtx = null;

function getAudioContext() {
  if (typeof window === 'undefined') return null;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type = 'click', isEnabled = true) {
  if (!isEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    switch (type) {
      case 'click': {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
        break;
      }

      case 'star': {
        // High sparkling bell chime
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + (i * 0.06);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.12, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
        break;
      }

      case 'success': {
        // Joyful fanfare: C - E - G - high C
        const notes = [
          { f: 523.25, d: 0.1 },  // C5
          { f: 659.25, d: 0.1 },  // E5
          { f: 783.99, d: 0.12 }, // G5
          { f: 1046.5, d: 0.35 }  // C6
        ];
        let offset = 0;
        notes.forEach(({ f, d }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + offset;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + d);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + d + 0.05);

          offset += d * 0.85;
        });
        break;
      }

      case 'tryAgain': {
        // Playful cartoon "boing"
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
        break;
      }

      case 'badge': {
        // Power-up ascending flourish
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
        break;
      }
    }
  } catch (e) {
    console.debug('Audio error:', e);
  }
}


  // --- Confetti Module ---
  /**
 * Confetti Celebration Engine
 * Renders colorful stars, confetti ribbons, and sparkles on canvas.
 */

function triggerConfetti(canvasElement) {
  if (!canvasElement) return;

  const ctx = canvasElement.getContext('2d');
  if (!ctx) return;

  const width = (canvasElement.width = window.innerWidth);
  const height = (canvasElement.height = window.innerHeight);

  const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#e056fd', '#00d2d3'];
  const particles = [];
  const particleCount = 120;

  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: width / 2,
      y: height / 2 + 50,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 0.8) * 22,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 12,
      opacity: 1,
      shape: Math.random() > 0.4 ? 'rect' : 'star'
    });
  }

  let animationFrameId;

  function render() {
    ctx.clearRect(0, 0, width, height);

    let activeCount = 0;

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45; // gravity
      p.vx *= 0.98; // air resistance
      p.rotation += p.vRot;
      p.opacity -= 0.009; // fade out

      if (p.opacity > 0 && p.y < height + 50) {
        activeCount++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.6);
        } else {
          // Draw mini star
          ctx.beginPath();
          for (let s = 0; s < 5; s++) {
            ctx.lineTo(
              Math.cos(((18 + s * 72) * Math.PI) / 180) * p.size,
              -Math.sin(((18 + s * 72) * Math.PI) / 180) * p.size
            );
            ctx.lineTo(
              Math.cos(((54 + s * 72) * Math.PI) / 180) * (p.size / 2),
              -Math.sin(((54 + s * 72) * Math.PI) / 180) * (p.size / 2)
            );
          }
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }
    }

    if (activeCount > 0) {
      animationFrameId = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, width, height);
      cancelAnimationFrame(animationFrameId);
    }
  }

  render();
}


  // --- Speech Module ---
  /**
 * Speech Narrator Module
 * Uses Web Speech API to read lessons and challenge missions aloud to kids.
 */

let currentUtterance = null;

function speakText(text, lang = 'en', onEndCallback = null) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    console.warn('Speech synthesis not supported in this environment');
    if (onEndCallback) onEndCallback();
    return;
  }

  // Stop any ongoing speech
  window.speechSynthesis.cancel();

  if (!text) {
    if (onEndCallback) onEndCallback();
    return;
  }

  // Clean HTML tags or markdown formatting
  const plainText = text.replace(/<[^>]+>/g, '').replace(/[#*`_]/g, '');

  const utterance = new SpeechSynthesisUtterance(plainText);
  utterance.rate = 0.95; // slightly slower, clear for kids
  utterance.pitch = 1.05; // friendly, upbeat
  utterance.lang = lang === 'uz' ? 'uz-UZ' : 'en-US';

  // Find best matching voice
  const voices = window.speechSynthesis.getVoices() || [];
  if (voices.length > 0) {
    let bestVoice = null;
    if (lang === 'uz') {
      bestVoice = voices.find(v => v.lang.startsWith('uz')) || voices.find(v => v.lang.startsWith('ru'));
    }
    if (!bestVoice) {
      bestVoice = voices.find(
        v => (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Zira')) && v.lang.startsWith('en')
      ) || voices.find(v => v.lang.startsWith('en'));
    }
    if (bestVoice) {
      utterance.voice = bestVoice;
    }
  }

  utterance.onend = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  utterance.onerror = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    currentUtterance = null;
  }
}

function isSpeaking() {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return false;
  return window.speechSynthesis.speaking;
}

// Setup one-click copy listener
function setupCopyBtn(container, codeSelector, btnSelector) {
  const btn = container.querySelector(btnSelector);
  const codeEl = container.querySelector(codeSelector);
  btn?.addEventListener('click', () => {
    if (codeEl) {
      navigator.clipboard?.writeText(codeEl.textContent);
      const old = btn.textContent;
      btn.textContent = '✅ Copied!';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }
  });
}

/**
 * Universal Stepful Lab Controller
 * Renders the multi-stage stepper and wires previous/next and step clicking.
 */
function createStepfulLab(container, def, isUz) {
  const totalSteps = def.steps.length;
  let currentStep = 0;
  let customState = { ...(def.initialState || {}) };

  // Render outer shell once:
  container.innerHTML = `
    <div class="topic-lab-wrapper">
      <div class="topic-lab-controls">
        <div class="evolution-slider-panel">
          <div class="slider-meta-row">
            <div class="slider-title-tag">
              <span>🎚️</span>
              <span>${isUz ? "Evolyutsiya Slayderi" : "Evolution Slider"}</span>
            </div>
            <div class="slider-current-stage">
              <span class="stage-num-badge" id="badge-stage-num">1 / ${totalSteps}</span>
              <strong class="stage-name" id="badge-stage-name">${isUz ? def.steps[0].title.uz : def.steps[0].title.en}</strong>
            </div>
          </div>

          <div class="slider-track-container">
            <input 
              type="range" 
              id="evolution-range-slider" 
              class="evolution-range-input" 
              min="0" 
              max="${totalSteps - 1}" 
              value="0" 
              step="1"
            />
            <div class="slider-stops-bar" id="slider-stops-bar">
              ${def.steps.map((s, idx) => `
                <div class="slider-stop-point ${idx === 0 ? 'active' : ''}" data-step="${idx}">
                  <div class="stop-dot">${idx + 1}</div>
                  <div class="stop-title">${isUz ? s.title.uz : s.title.en}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="topic-lab-status" id="lab-status"></div>

        <div id="step-custom-controls"></div>

        <div class="lab-code-output">
          <div class="code-header">
            <span>${isUz ? 'Jonli Kod:' : 'Live Code:'}</span>
            <button id="btn-copy-lab" class="btn-sm">📋 Copy</button>
          </div>
          <pre><code id="lab-code"></code></pre>
        </div>
      </div>

      <div class="topic-lab-stage" id="lab-stage"></div>
    </div>
  `;

  const slider = container.querySelector('#evolution-range-slider');
  const badgeNum = container.querySelector('#badge-stage-num');
  const badgeName = container.querySelector('#badge-stage-name');
  const stopsBar = container.querySelector('#slider-stops-bar');
  const statusEl = container.querySelector('#lab-status');
  const controlsMount = container.querySelector('#step-custom-controls');
  const codeEl = container.querySelector('#lab-code');
  const stageEl = container.querySelector('#lab-stage');

  function update() {
    const step = def.steps[currentStep];

    // 1. Update slider & badges
    slider.value = currentStep;
    badgeNum.textContent = `${currentStep + 1} / ${totalSteps}`;
    badgeName.textContent = isUz ? step.title.uz : step.title.en;

    // 2. Update stop dots
    stopsBar.querySelectorAll('.slider-stop-point').forEach((pt, idx) => {
      pt.classList.toggle('active', idx === currentStep);
      pt.classList.toggle('passed', idx < currentStep);
    });

    // 3. Update status explanation
    statusEl.innerHTML = isUz ? step.explanation.uz : step.explanation.en;

    // 4. Update custom controls if any on this step
    controlsMount.innerHTML = '';
    if (step.renderControls) {
      step.renderControls(controlsMount, customState, updateCodeAndStage, isUz);
    }

    // 5. Update code and stage
    updateCodeAndStage();
  }

  function updateCodeAndStage() {
    const step = def.steps[currentStep];
    const codeStr = typeof step.code === 'function' ? step.code(customState, isUz) : step.code;
    codeEl.textContent = codeStr;
    step.renderStage(stageEl, customState, isUz);
  }

  // Slider input listener (scrubbing)
  slider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value, 10);
    if (!isNaN(val) && val !== currentStep) {
      currentStep = val;
      update();
    }
  });

  // Click on stop point
  stopsBar.querySelectorAll('.slider-stop-point').forEach(pt => {
    pt.addEventListener('click', () => {
      const target = parseInt(pt.getAttribute('data-step'), 10);
      if (!isNaN(target) && target !== currentStep) {
        currentStep = target;
        update();
      }
    });
  });

  setupCopyBtn(container, '#lab-code', '#btn-copy-lab');
  update();
}

function renderTagsLab(container, lesson, isUz) {
  createStepfulLab(container, {
    initialState: { bold: true, italic: false, underline: false, strike: false },
    steps: [
      {
        title: { en: '1. Plain Text', uz: '1. Oddiy Matn' },
        code: 'Salom Kiber Qahramon!',
        explanation: {
          en: 'Step 1: Raw text has no tags. The browser renders it with standard weight and no styling.',
          uz: "1-Qadam: Oddiy matnda hech qanday teg yo'q. Brauzer uni standart oddiy shriftda ko'rsatadi."
        },
        renderStage(stage) {
          stage.innerHTML = `<div style="font-size: 22px; color: white;">Salom Kiber Qahramon!</div>`;
        }
      },
      {
        title: { en: '2. Bold <b>', uz: '2. Qalin <b>' },
        code: '<b>Salom Kiber Qahramon!</b>',
        explanation: {
          en: 'Step 2: The <b> tag makes the text heavy and bold so important words stand out.',
          uz: "2-Qadam: <b> tegi matnni qalin (bold) qiladi va muhim so'zlarni ajratib ko'rsatadi."
        },
        renderStage(stage) {
          stage.innerHTML = `<div style="font-size: 22px; font-weight: bold; color: white;">Salom Kiber Qahramon!</div>`;
        }
      },
      {
        title: { en: '3. Italic & Strike', uz: '3. Qiya va Chiziq' },
        code: '<b><i><s>Salom Kiber Qahramon!</s></i></b>',
        explanation: {
          en: 'Step 3: Tags can be nested inside each other! Here <b>, <i> and <s> combine their effects.',
          uz: "3-Qadam: Teglar bir-birining ichiga joylashishi mumkin! <b>, <i> va <s> effektlari birlashdi."
        },
        renderStage(stage) {
          stage.innerHTML = `<div style="font-size: 22px; font-weight: bold; font-style: italic; text-decoration: line-through; color: white;">Salom Kiber Qahramon!</div>`;
        }
      },
      {
        title: { en: '4. Interactive Studio', uz: '4. Interaktiv Studiya' },
        code(s) {
          let open = '', close = '';
          if (s.bold) { open += '<b>'; close = '</b>' + close; }
          if (s.italic) { open += '<i>'; close = '</i>' + close; }
          if (s.underline) { open += '<u>'; close = '</u>' + close; }
          if (s.strike) { open += '<s>'; close = '</s>' + close; }
          return `${open}Salom Kiber Qahramon!${close}`;
        },
        explanation: {
          en: 'Step 4: Interactive Master Studio! Toggle the tags below to design your own custom combination.',
          uz: "4-Qadam: Interaktiv Studiya! Tugmalarni bosib, istalgan teglar birikmasini erkin sinab ko'ring."
        },
        renderControls(mount, s, update) {
          mount.innerHTML = `
            <div class="btn-pill-group">
              <button class="btn-pill ${s.bold ? 'active' : ''}" id="p-b"><b>&lt;b&gt; Bold</b></button>
              <button class="btn-pill ${s.italic ? 'active' : ''}" id="p-i"><i>&lt;i&gt; Italic</i></button>
              <button class="btn-pill ${s.underline ? 'active' : ''}" id="p-u"><u>&lt;u&gt; Underline</u></button>
              <button class="btn-pill ${s.strike ? 'active' : ''}" id="p-s"><s>&lt;s&gt; Strike</s></button>
            </div>
          `;
          mount.querySelector('#p-b').onclick = (e) => { s.bold = !s.bold; e.target.classList.toggle('active', s.bold); update(); };
          mount.querySelector('#p-i').onclick = (e) => { s.italic = !s.italic; e.target.classList.toggle('active', s.italic); update(); };
          mount.querySelector('#p-u').onclick = (e) => { s.underline = !s.underline; e.target.classList.toggle('active', s.underline); update(); };
          mount.querySelector('#p-s').onclick = (e) => { s.strike = !s.strike; e.target.classList.toggle('active', s.strike); update(); };
        },
        renderStage(stage, s) {
          const decs = [];
          if (s.underline) decs.push('underline');
          if (s.strike) decs.push('line-through');
          stage.innerHTML = `
            <div style="font-size: 22px; font-weight: ${s.bold ? 'bold' : 'normal'}; font-style: ${s.italic ? 'italic' : 'normal'}; text-decoration: ${decs.length ? decs.join(' ') : 'none'}; color: white; padding: 20px; background: #141722; border-radius: 12px; text-align: center;">
              Salom Kiber Qahramon!
            </div>
          `;
        }
      }
    ]
  }, isUz);
}

function renderAnimationsLab(container, lesson, isUz) {

        }
      },
      {
        title: { en: '2. @keyframes Path', uz: '2. @keyframes Yo\'li' },
        code: '@keyframes bounce {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(-70px); }\n}',
        explanation: {
          en: 'Step 2: @keyframes defines the motion path: jumping 70px upwards at the halfway point.',

        },
        renderStage(stage) {
          stage.innerHTML = `<div style="border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 20px; color: #38bdf8;">Trajectory: 0px ➔ -70px ➔ 0px</div>`;
        }
      },
      {
        title: { en: '3. infinite Loop', uz: '3. Cheksiz Sikl' },
        code: '.ball {\n  animation: bounce 1s infinite ease-in-out;\n}',
        explanation: {
          en: 'Step 3: Attaching the animation with infinite keeps the ball bouncing continuously in rhythm!',
          uz: "3-Qadam: infinite kaliti animatsiyani cheksiz ravishda bir tekis takrorlaydi!"
        },
        renderStage(stage) {
          stage.innerHTML = `
            <style>@keyframes b1 { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-60px);} }</style>

          `;
        }
      },
      {
        title: { en: '4. Speed Studio', uz: '4. Tezlik Studiyasi' },
        code(s) {

            </div>
          `;
        }
      }
    ]
  }, isUz);
}

        },
        renderStage(stage) {

        explanation: {
          en: 'Step 3: transition: all 0.3s ease interpolates intermediate frames like warm butter!',

        explanation: {
          en: 'Step 4: Test 0s snap vs 0.3s butter smooth vs 1.5s slow-motion below!',

/**
 * Resolves a bilingual string or object: { en: '...', uz: '...' }
 */
function localize(val, lang = 'en') {
  if (val === null || val === undefined) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'object') {
    return val[lang] || val.en || Object.values(val)[0] || '';
  }
  return String(val);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Formats educational markdown and escapes dangerous HTML to prevent DOM table corruption.
 * Safely converts `code` to <code class="inline-code">, **bold** to <strong>, *italic* to <em>, and newlines to <br>.
 */
function formatProse(str) {
  if (str === null || str === undefined) return '';
  const text = String(str);
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function attachGlobalListeners() {
  function switchLang(lang) {
    stopSpeaking();
    state = setLanguage(state, lang);
    saveStateToStorage(state);
    playSound('click', state.audioEnabled);
    applyStateToUI();
    if (currentView === 'sandbox') {
      renderSandboxView();
    } else if (currentView === 'labs') {
      renderLabsView();
    } else {
      renderLessonView();
    }
  }

  // Dual Segmented Switcher
  elements.btnLangUz?.addEventListener('click', () => switchLang('uz'));
  elements.btnLangEn?.addEventListener('click', () => switchLang('en'));

  // Language Toggle (English <-> Uzbek)
  elements.btnLang?.addEventListener('click', () => {
    state = toggleLanguage(state);
    saveStateToStorage(state);
    playSound('click', state.audioEnabled);
    applyStateToUI();
    if (currentView === 'sandbox') {
      renderSandboxView();
    } else if (currentView === 'labs') {
      renderLabsView();
    } else {
      renderLessonView();
    }
  });

  // Theme Toggle (Calm Dark <-> OLED Black)
  elements.btnTheme?.addEventListener('click', () => {
    state.theme = state.theme === 'oled' ? 'dark' : 'oled';
    saveStateToStorage(state);
    applyTheme();
    playSound('click', state.audioEnabled);
  });

  // Audio toggle
  elements.btnAudio?.addEventListener('click', () => {
    state.audioEnabled = !state.audioEnabled;
    saveStateToStorage(state);
    elements.btnAudio.textContent = state.audioEnabled ? '🔊' : '🔇';
    playSound('click', state.audioEnabled);
  });

  // Teacher Mode toggle
  elements.btnTeacher?.addEventListener('click', () => {
    state.teacherMode = !state.teacherMode;
    saveStateToStorage(state);
    elements.btnTeacher.classList.toggle('active', state.teacherMode);
    playSound('click', state.audioEnabled);
    const box = document.getElementById('teacher-playbook-box');
    if (box) {
      box.style.display = state.teacherMode ? 'block' : 'none';
    }
  });

  // Visual Interactive Labs toggle
  elements.btnLabs?.addEventListener('click', () => {
    stopSpeaking();
    currentView = currentView === 'labs' ? 'lesson' : 'labs';
    elements.btnLabs.classList.toggle('active', currentView === 'labs');
    elements.btnSandbox?.classList.remove('active');
    playSound('click', state.audioEnabled);

    if (currentView === 'labs') {
      renderLabsView();
    } else {
      renderLessonView();
    }
  });

  // Free Sandbox toggle
  elements.btnSandbox?.addEventListener('click', () => {
    stopSpeaking();
    currentView = currentView === 'sandbox' ? 'lesson' : 'sandbox';
    elements.btnSandbox.classList.toggle('active', currentView === 'sandbox');
    elements.btnLabs?.classList.remove('active');
    playSound('click', state.audioEnabled);

    if (currentView === 'sandbox') {
      renderSandboxView();
    } else {
      renderLessonView();
    }
  });

  // Brand click -> Return to lessons
  document.querySelector('.brand')?.addEventListener('click', () => {
    stopSpeaking();
    currentView = 'lesson';
    elements.btnSandbox?.classList.remove('active');
    elements.btnLabs?.classList.remove('active');
    playSound('click', state.audioEnabled);
    selectLesson(LESSONS[0].id);
  });
}

function applyTheme() {
  const theme = state.theme || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  if (elements.btnTheme) {
    elements.btnTheme.textContent = theme === 'oled' ? '🌑' : '🌙';
    elements.btnTheme.title = theme === 'oled' ? 'Switch to Calm Dark Mode' : 'Switch to Deep OLED Night';

function applyStateToUI() {
  applyTheme();
  if (elements.starCount) elements.starCount.textContent = `⭐ ${state.stars}`;

function updateProgressUI() {
  const total = LESSONS.length;
  const completed = state.completedLessons.length;
  const percent = Math.round((completed / total) * 100);

  if (elements.progressFill) elements.progressFill.style.width = `${percent}%`;
  const unitName = state.lang === 'uz' ? 'Mavzular' : 'Lessons';
  if (elements.progressText) elements.progressText.textContent = `${completed} / ${total} ${unitName} (${percent}%)`;

function renderSidebar() {
  if (!elements.sidebarLessonList) return;

  let html = '';
  MODULES.forEach(mod => {

      html += `
        <li class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" data-lesson-id="${lesson.id}">

          <span class="lesson-item-text">${escapeHtml(localize(lesson.title, state.lang))}</span>

  elements.sidebarLessonList.innerHTML = html;

  const items = elements.sidebarLessonList.querySelectorAll('.lesson-item');
  items.forEach(item => {
    item.addEventListener('click', () => {
      const lessonId = item.getAttribute('data-lesson-id');

  });

/**
 * Wraps bare student snippets cleanly so kids never have to write HTML boilerplate!
 */
function wrapForPreview(snippet) {
  if (snippet.includes('<!DOCTYPE') || snippet.includes('<html')) {
    // If full document does not specify a background, inject dark canvas style to prevent blinding white flashes
    if (!snippet.includes('background:') && !snippet.includes('background-color:')) {
      if (snippet.includes('<head>')) {
        return snippet.replace('<head>', '<head><style>body { background-color: #0b0d13; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>');
      }
      return `<style>body { background-color: #0b0d13; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }</style>${snippet}`;
    }
    return snippet;
  }

  return `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0b0d13;
      color: #cbd5e1;
      line-height: 1.6;
    }
    h1, h2, h3, h4 { margin-top: 0; color: #f1f5f9; }
    p { margin-bottom: 16px; color: #cbd5e1; }
    button {
      background: #5b5fc7;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 8px;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    button:hover { background: #4e52b3; }
    ul, ol { padding-left: 24px; margin-bottom: 16px; }
    li { margin-bottom: 6px; }
    a { color: #38bdf8; text-decoration: underline; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    table {
      border-collapse: collapse;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 8px 12px;
    }
    th {
      background: rgba(91, 95, 199, 0.25);
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  ${snippet}
</body>
</html>`;
}

function setupLessonListeners(lesson) {
  const textarea = document.getElementById('code-textarea');

  textarea?.addEventListener('input', () => {
    currentCode = textarea.value;
    updateLivePreview();
    updateLineNumbers();
  });

  // Tab indent
  textarea?.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
      currentCode = textarea.value;
      updateLivePreview();
      updateLineNumbers();
    }
  });

  // Quick Tag chips
  const tagChips = document.querySelectorAll('.tag-chip');
  tagChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const tag = chip.getAttribute('data-tag');
      insertTextAtCursor(textarea, tag);
      playSound('click', state.audioEnabled);
    });
  });

  // Start Practice Button: loads starter code, smoothly scrolls to editor, focuses textarea
  document.getElementById('btn-start-practice')?.addEventListener('click', () => {
    textarea.value = lesson.initialCode;
    currentCode = lesson.initialCode;
    updateLivePreview();
    updateLineNumbers();
    playSound('click', state.audioEnabled);
    document.querySelector('.code-editor-wrapper')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    textarea.focus();
  });

  // Reset to initial starter code
  document.getElementById('btn-reset-code')?.addEventListener('click', () => {
    textarea.value = lesson.initialCode;
    currentCode = lesson.initialCode;
    updateLivePreview();
    updateLineNumbers();
    playSound('click', state.audioEnabled);
  });

  // Copy
  document.getElementById('btn-copy-code')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(textarea.value);
    const btn = document.getElementById('btn-copy-code');
    btn.textContent = t('copiedMsg', state.lang);
    setTimeout(() => { btn.textContent = t('copyBtn', state.lang); }, 1500);
  });

  // List of Tags Button
  document.getElementById('btn-tag-list')?.addEventListener('click', () => {
    openTagListModal(lesson);
  });

  // Dedicated Per-Topic Visual Lab Button
  document.getElementById('btn-topic-lab')?.addEventListener('click', () => {
    openTopicLabModal(lesson);
  });


  // Preview Tabs
  setupPreviewTabs(lesson);

  // Hint
  document.getElementById('btn-hint')?.addEventListener('click', () => {
    playSound('click', state.audioEnabled);
    const hintText = localize(lesson.challenge.hint, state.lang);
    alert(`💡 HINT / MASLAHAT:\n\n${hintText}`);
  });

  // Check code
  document.getElementById('btn-verify-mission')?.addEventListener('click', () => {
    handleChallengeVerification(lesson);
  });

  // Quick Tag Insert Chips (1-click insert directly at cursor)
  const insertChips = document.querySelectorAll('.tag-insert-chip');
  insertChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const tag = chip.getAttribute('data-insert');
      insertTextAtCursor(textarea, tag);
      playSound('click', state.audioEnabled);
    });
  });

  // Read Aloud / Voice Narrator
  const btnRead = document.getElementById('btn-read-mission');
  btnRead?.addEventListener('click', () => {
    playSound('click', state.audioEnabled);
    if (isSpeaking()) {
      stopSpeaking();
      btnRead.classList.remove('speaking');
      btnRead.textContent = `🔊 ${t('readAloudBtn', state.lang)}`;
    } else {
      btnRead.classList.add('speaking');
      btnRead.textContent = `⏹️ ${t('stopSpeechBtn', state.lang)}`;
      speakText(localize(lesson.challenge.mission, state.lang), state.lang, () => {
        btnRead.classList.remove('speaking');
        btnRead.textContent = `🔊 ${t('readAloudBtn', state.lang)}`;
      });
    }
  });
}

function insertTextAtCursor(textarea, text) {
  if (!textarea) return;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
  textarea.selectionStart = textarea.selectionEnd = start + text.length;
  textarea.focus();
  currentCode = textarea.value;
  updateLivePreview();
  updateLineNumbers();
}

function updateLineNumbers() {
  const textarea = document.getElementById('code-textarea');
  const lineNumbers = document.getElementById('line-numbers');
  if (!textarea || !lineNumbers) return;

  const lines = (textarea.value || '').split('\n').length;
  let numbersHtml = '';
  for (let i = 1; i <= Math.max(lines, 1); i++) {
    numbersHtml += `${i}<br>`;
  }
  lineNumbers.innerHTML = numbersHtml;
}

function updateLivePreview() {
  const iframe = document.getElementById('live-iframe');
  if (!iframe) return;

  iframe.srcdoc = wrapForPreview(currentCode);
}

function setupPreviewTabs(lesson) {
  const tabLive = document.getElementById('tab-live');
  const tabTarget = document.getElementById('tab-target');
  const tabSide = document.getElementById('tab-side');
  const previewContainer = document.getElementById('preview-container');

  function resetTabs() {
    [tabLive, tabTarget, tabSide].forEach(t => t?.classList.remove('active'));
  }

  tabLive?.addEventListener('click', () => {
    resetTabs();
    tabLive.classList.add('active');
    activePreviewTab = 'live';
    previewContainer.innerHTML = `<iframe id="live-iframe" class="preview-iframe" sandbox="allow-scripts allow-modals"></iframe>`;
    updateLivePreview();
    playSound('click', state.audioEnabled);
  });

  tabTarget?.addEventListener('click', () => {

    tabTarget.classList.add('active');
    activePreviewTab = 'target';
    previewContainer.innerHTML = `
      <div class="target-view-container">
        <div class="target-explanation-box">

        </div>
        <iframe id="target-iframe" class="preview-iframe" sandbox="allow-scripts allow-modals"></iframe>

  tabSide?.addEventListener('click', () => {
    resetTabs();
    tabSide.classList.add('active');

      <div style="display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%;">
        <div style="border-right: 1px solid var(--border-color); display: flex; flex-direction: column;">
          <div style="background: var(--bg-surface); padding: 4px 10px; font-size: 10px; font-weight: 800; color: var(--text-muted);">${t('yourResultTab', state.lang).toUpperCase()}</div>

        </div>

    const targetIframe = document.getElementById('target-iframe');
    if (targetIframe) {
      targetIframe.srcdoc = wrapForPreview(lesson.targetCode);
    }
    playSound('click', state.audioEnabled);
  });

function handleChallengeVerification(lesson) {
  const result = validateChallenge(currentCode, lesson.challenge.rules);

  if (result.passed) {
    playSound('success', state.audioEnabled);
    triggerConfetti(elements.confettiCanvas);

    const previousCompleted = isLessonCompleted(state, lesson.id);
    state = completeLesson(state, lesson.id, 3);
    saveStateToStorage(state);
    applyStateToUI();

    showCelebrationModal(lesson, previousCompleted);
  } else {
    playSound('tryAgain', state.audioEnabled);
    showTryAgainModal(result.feedback);
  }
}

function showCelebrationModal(lesson, wasAlreadyCompleted) {
  const currentIdx = LESSONS.findIndex(l => l.id === lesson.id);
  const nextLesson = LESSONS[currentIdx + 1];

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon">🎉</div>
      <h3 class="modal-title">${t('modalCompleteTitle', state.lang)}</h3>
      <div class="modal-body">
        <p>${state.lang === 'uz' ? `Ajoyib! Siz <strong>${localize(lesson.title, state.lang)}</strong> mavzusini muvaffaqiyatli o'zlashtirdingiz!` : `Awesome! You mastered <strong>${localize(lesson.title, state.lang)}</strong>!`}</p>
        <p style="margin-top: 8px; font-size: 15px; color: var(--accent-amber); font-weight: 800;">
          ${wasAlreadyCompleted ? (state.lang === 'uz' ? '⭐ Vazifa qayta tasdiqlandi!' : '⭐ Mission verified again!') : t('starsEarnedMsg', state.lang)}
        </p>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-close" class="btn-modal btn-modal-secondary">${t('stayHereBtn', state.lang)}</button>
        ${nextLesson ? `<button id="btn-modal-next" class="btn-modal btn-modal-primary">${t('nextLessonBtn', state.lang)}</button>` : ''}
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector('#btn-modal-close')?.addEventListener('click', () => modal.remove());
  modal.querySelector('#btn-modal-next')?.addEventListener('click', () => {
    modal.remove();
    if (nextLesson) selectLesson(nextLesson.id);
  });
}

function showTryAgainModal(feedback) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon">🧐</div>
      <h3 class="modal-title" style="color: var(--accent-red);">${t('tryAgainTitle', state.lang)}</h3>

      <div class="modal-actions">
        <button id="btn-modal-retry" class="btn-modal btn-modal-primary">${t('retryBtn', state.lang)}</button>

  document.body.appendChild(modal);
  modal.querySelector('#btn-modal-retry')?.addEventListener('click', () => modal.remove());
}

function renderLabsView() {

      </div>

      <div class="labs-nav-bar">
