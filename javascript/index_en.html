<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraft JS ⚡ JavaScript for Kids (English)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Google Fonts: Outfit for clean legibility, Fira Code for code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
/* Inlined Stylesheet */
/* ===================================================================
   CodeCraft Kids: Calm Dark Theme & Minimalist Design
   Easy on the eyes, zero visual clutter, focused on bite-sized learning.
   =================================================================== */

:root {
  --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;

  /* Eye-friendly Calm Slate Theme (Soft Midnight, Zero Glare) */
  --bg-app: #0b0d13;
  --bg-sidebar: #0f121a;
  --bg-card: #141722;
  --bg-surface: #1a1f2e;
  --bg-code: #080a0f;
  
  --text-main: #cbd5e1;
  --text-muted: #788699;
  --text-code: #e2e8f0;

  --primary: #5b5fc7;
  --primary-hover: #4e52b3;
  --primary-light: rgba(91, 95, 199, 0.12);
  
  --accent-teal: #14b8a6;
  --accent-pink: #ec4899;
  --accent-amber: #eab308;
  --accent-green: #22c55e;
  --accent-red: #ef4444;

  --border-color: #1e2433;
  --border-focus: #5b5fc7;

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.6);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  --header-height: 54px;
}

/* Deep OLED Pure Black Mode */
[data-theme="oled"] {
  --bg-app: #000000;
  --bg-sidebar: #050608;
  --bg-card: #0a0c10;
  --bg-surface: #10131a;
  --bg-code: #000000;
  --border-color: #161a24;
  --text-main: #b8c2cc;
  --text-muted: #64748b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-app);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  line-height: 1.5;
}

/* ===================================================================
   Streamlined, Clean Header (Zero Clutter)
   =================================================================== */
.app-header {
  height: var(--header-height);
  background-color: var(--bg-sidebar);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}

.brand-icon {
  font-size: 26px;
}

.brand-text h1 {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.3px;
}

.brand-text span {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background-color: rgba(251, 191, 36, 0.12);
  color: var(--accent-amber);
  border: 1px solid rgba(251, 191, 36, 0.25);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-weight: 800;
  font-size: 13px;
}

.btn-header {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-icon-only {
  padding: 6px 10px;
  font-size: 14px;
}

.btn-link-tags {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--accent-teal);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}

.btn-link-tags:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: #ffffff;
}

/* Dual Language Segmented Control */
.lang-switcher {
  display: flex;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 2px;
  gap: 2px;
}

.lang-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.lang-tab:hover {
  color: var(--text-main);
}

.lang-tab.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(91, 95, 199, 0.4);
}

.btn-header:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
}

.btn-header.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

/* ===================================================================
   Main Layout: Sidebar + Workspace
   =================================================================== */
.app-layout {
  display: flex;
  flex: 1;
  height: calc(100vh - var(--header-height));
  overflow: hidden;
}

.app-sidebar {
  width: 280px;
  flex-shrink: 0;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  user-select: none;
}

.sidebar-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.progress-track {
  height: 6px;
  background-color: var(--bg-surface);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-teal), var(--primary));
  width: 0%;
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}

.nav-section-title {
  padding: 14px 18px 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
}

.lesson-list {
  list-style: none;
  padding: 0 8px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin-bottom: 3px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  position: relative;
}

.lesson-item:hover {
  background-color: var(--bg-surface);
}

.lesson-item.active {
  background-color: var(--primary);
  color: #ffffff;
}

.lesson-item.completed::after {
  content: '⭐';
  position: absolute;
  right: 10px;
  font-size: 12px;
}

.lesson-item-icon {
  font-size: 16px;
}

.lesson-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===================================================================
   Workspace Content Stage
   =================================================================== */
.workspace-stage {
  flex: 1;
  min-width: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background-color: var(--bg-app);
}

.lesson-banner {
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.banner-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.badge-module {
  background-color: var(--primary-light);
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.badge-tags {
  font-family: var(--font-code);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--accent-pink);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

.banner-title {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.banner-summary {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 2px;
}

/* ===================================================================
   Human Intro Card (Plain explanation for kids)
   =================================================================== */
.human-intro-card {
  margin: 14px 24px 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}

.human-intro-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}

.human-intro-item h4 {
  font-size: 13px;
  font-weight: 800;
  color: var(--accent-teal);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.human-intro-item p {
  font-size: 13px;
  color: var(--text-main);
  line-height: 1.5;
}

/* ===================================================================
   Tag Showcase Bar (Simple tags gallery: <b>, <i>, <u>, etc.)
   =================================================================== */
.tag-showcase-bar {
  margin: 12px 24px 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow-x: auto;
}

.showcase-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent-amber);
  white-space: nowrap;
}

.showcase-chips {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.showcase-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.showcase-chip code {
  font-family: var(--font-code);
  font-weight: 700;
  color: var(--accent-teal);
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 4px;
}

.showcase-chip span {
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
}

.inline-code {
  font-family: var(--font-code);
  background: rgba(124, 108, 247, 0.15);
  color: var(--accent-teal);
  border: 1px solid rgba(124, 108, 247, 0.3);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.88em;
  font-weight: 600;
  vertical-align: baseline;
}

/* ===================================================================
   STEP-BY-STEP CODE BREAKDOWN (What Each Specific Piece Does)
   =================================================================== */
.step-breakdown-card {
  margin: 14px 24px 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}

.step-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.step-header-text {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-card-header h3 {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-main);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.step-count-pill {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  padding: 2px 8px;
  border-radius: var(--radius-full);
}

.step-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}

.step-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s;
}

.step-item:hover {
  border-color: var(--primary);
}

.step-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.step-num-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-amber);
  background: rgba(234, 179, 8, 0.12);
  border: 1px solid rgba(234, 179, 8, 0.25);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}

.step-role-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--primary);
  background: var(--primary-light);
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.step-code-focus {
  display: flex;
  align-items: center;
}

.step-code-chip {
  font-family: var(--font-code);
  font-size: 13px;
  font-weight: 700;
  color: #38bdf8;
  background: var(--bg-code);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  word-break: break-all;
}

.step-explanation {
  font-size: 12.5px;
  color: var(--text-main);
  line-height: 1.45;
}

.step-result-box {
  background: var(--bg-code);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.step-result-heading {
  font-size: 11.5px;
  color: var(--accent-teal);
  display: flex;
  align-items: flex-start;
  gap: 5px;
  line-height: 1.35;
}

.step-visual-render {
  background: rgba(255, 255, 255, 0.02);
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  font-size: 12px;
  color: var(--text-main);
}

.mini-canvas {
  width: 100%;
  text-align: center;
  font-size: 12.5px;
}

/* ===================================================================
   Teacher & Parent Playbook (Shown when toggled)
   =================================================================== */
.teacher-playbook {
  background: #1e1b13;
  border: 1px solid #785210;
  border-radius: var(--radius-md);
  margin: 12px 24px 0;
  padding: 14px 18px;
  color: #fde047;
}

.teacher-playbook h4 {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.teacher-playbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  font-size: 12px;
  color: #fef08a;
}

.teacher-item strong {
  display: block;
  color: #fb923c;
  margin-bottom: 2px;
}

/* ===================================================================
   Editor & Dual Preview Split
   =================================================================== */
.editor-stage-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 24px;
  flex: 1;
}

.pane-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.pane-header {
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.pane-title {
  font-size: 13px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 6px;
}

.pane-tools {
  display: flex;
  gap: 6px;
}

.btn-tool {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-tool:hover {
  background: var(--bg-surface);
  color: var(--text-main);
  border-color: var(--primary);
}

/* Quick Tags Toolbar */
.quick-tags-bar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
}

.quick-tag-label {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.tag-chip {
  font-family: var(--font-code);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--accent-teal);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.tag-chip:hover {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

/* Code Editor Textarea */
.code-editor-wrapper {
  flex: 1;
  position: relative;
  background: var(--bg-code);
  display: flex;
  min-height: 280px;
}

.editor-line-numbers {
  width: 36px;
  background: rgba(0, 0, 0, 0.25);
  color: #64748b;
  font-family: var(--font-code);
  font-size: 12px;
  line-height: 22px;
  padding: 12px 6px;
  text-align: right;
  user-select: none;
  border-right: 1px solid var(--border-color);
}

.code-textarea {
  flex: 1;
  background: transparent;
  color: var(--text-code);
  font-family: var(--font-code);
  font-size: 13px;
  line-height: 22px;
  padding: 12px 14px;
  border: none;
  outline: none;
  resize: none;
  white-space: pre;
  tab-size: 2;
}

/* Right Pane: Preview Tabs */
.preview-tabs {
  display: flex;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.prev-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}

.prev-tab-btn.active {
  background: var(--bg-surface);
  color: #ffffff;
}

.preview-wrapper {
  flex: 1;
  position: relative;
  min-height: 280px;
  background: var(--bg-code);
  display: flex;
}

.preview-iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: var(--bg-code);
  color: var(--text-main);
}

.target-view-container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.target-explanation-box {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-main);
}

.target-explanation-box strong {
  color: var(--accent-amber);
}

/* ===================================================================
   HIGH-VISIBILITY MISSION SPOTLIGHT (Directly Above Code Editor)
   =================================================================== */
.mission-spotlight-card {
  margin: 16px 24px 0;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(91, 95, 199, 0.16));
  border: 2px solid #f59e0b;
  border-radius: var(--radius-lg);
  padding: 18px 22px;
  box-shadow: 0 4px 24px rgba(245, 158, 11, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.mission-spotlight-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.mission-spotlight-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(245, 158, 11, 0.24);
  border: 1px solid #f59e0b;
  color: #fbbf24;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.8px;
}

.mission-pulse-dot {
  width: 9px;
  height: 9px;
  background: #f59e0b;
  border-radius: 50%;
  box-shadow: 0 0 10px #f59e0b;
  animation: pulseMission 1.5s infinite;
}

@keyframes pulseMission {
  0% { transform: scale(0.9); opacity: 0.7; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #fbbf24; }
  100% { transform: scale(0.9); opacity: 0.7; }
}

.mission-quick-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-mission-hint {
  background: var(--bg-surface);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fbbf24;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-mission-hint:hover {
  background: rgba(245, 158, 11, 0.2);
  border-color: #f59e0b;
  color: #ffffff;
}

.btn-mission-verify {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #0b0d13;
  border: none;
  padding: 9px 22px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
  transition: all 0.15s;
}

.btn-mission-verify:hover {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
}

.mission-spotlight-body {
  background: rgba(11, 13, 19, 0.75);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}

.mission-spotlight-text {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.55;
  letter-spacing: 0.2px;
}

/* ===================================================================
   Mission Dock (Bottom Action Bar)
   =================================================================== */
.mission-dock {
  background: var(--bg-card);
  border-top: 1px solid var(--border-color);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  bottom: 0;
  z-index: 90;
}

.mission-tag {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent-pink);
  margin-bottom: 2px;
}

.mission-text {
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
}

.mission-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-hint {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.btn-hint:hover {
  color: var(--accent-amber);
  border-color: var(--accent-amber);
}

.btn-verify {
  background: var(--primary);
  color: #ffffff;
  border: none;
  padding: 9px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-verify:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

/* ===================================================================
   List of Tags Modal
   =================================================================== */
.tag-list-modal-card {
  max-width: 650px;
  width: 95%;
  text-align: left;
}

.tag-list-table-wrapper {
  max-height: 400px;
  overflow-y: auto;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
}

.tag-list-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.tag-list-table th {
  background: var(--bg-surface);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
}

.tag-list-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
}

.tag-list-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

.tag-code-pill {
  font-family: var(--font-code);
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-teal);
  background: var(--bg-code);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(45, 212, 191, 0.25);
  cursor: pointer;
  display: inline-block;
  transition: all 0.15s;
}

.tag-code-pill:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: #ffffff;
}

/* ===================================================================
   Modals & Overlays
   =================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(3px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  max-width: 440px;
  width: 90%;
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.modal-icon {
  font-size: 48px;
  margin-bottom: 8px;
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 6px;
}

.modal-body {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.modal-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.btn-modal {
  padding: 8px 18px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border: none;
}

.btn-modal-primary {
  background: var(--primary);
  color: #ffffff;
}

.btn-modal-secondary {
  background: var(--bg-surface);
  color: var(--text-main);
  border: 1px solid var(--border-color);
}

#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}

@media (max-width: 1024px) {
  .editor-stage-split {
    grid-template-columns: 1fr;
  }
  .app-sidebar {
    width: 240px;
  }
  .lab-grid {
    grid-template-columns: 1fr;
  }
}

/* ===================================================================
   Quick Tag Insertion Bar above code editor
   =================================================================== */
.editor-quick-tags-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  overflow-x: auto;
  scrollbar-width: thin;
}

.quick-tags-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  white-space: nowrap;
}

.quick-tags-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}

.tag-insert-chip {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--accent-cyan);
  font-family: var(--font-code);
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
  user-select: none;
}

.tag-insert-chip:hover {
  background: rgba(91, 95, 199, 0.2);
  border-color: var(--primary);
  color: #ffffff;
  transform: translateY(-1px);
}

.tag-insert-chip:active {
  transform: translateY(1px);
}

/* ===================================================================
   Read Aloud Speech Button in Mission Spotlight Card
   =================================================================== */
.btn-mission-read {
  background: rgba(45, 212, 191, 0.12);
  color: var(--accent-cyan);
  border: 1px solid rgba(45, 212, 191, 0.3);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}

.btn-mission-read:hover {
  background: rgba(45, 212, 191, 0.22);
  border-color: var(--accent-cyan);
  color: #ffffff;
}

.btn-mission-read.speaking {
  background: #ff5e7e;
  color: #ffffff;
  border-color: #ff5e7e;
  animation: pulse-read 1s infinite alternate;
}

@keyframes pulse-read {
  0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 94, 126, 0.4); }
  100% { transform: scale(1.04); box-shadow: 0 0 12px rgba(255, 94, 126, 0.6); }
}

/* ===================================================================
   Visual Labs View Styles (Box Model, Flexbox, Color, Grid)
   =================================================================== */
.labs-view-wrapper {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
}

.labs-nav-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  overflow-x: auto;
}

.labs-tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.labs-tab-btn:hover {
  color: var(--text-main);
  border-color: var(--primary);
}

.labs-tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(91, 95, 199, 0.35);
}

.lab-container {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.lab-header {
  margin-bottom: 20px;
}

.lab-header h3 {
  font-size: 20px;
  font-weight: 800;
  margin: 0 0 6px;
  color: var(--text-main);
}

.lab-header p {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

.lab-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 24px;
  align-items: start;
}

.lab-controls {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-group label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.dot-margin { background: #ff9f43; }
.dot-border { background: #fbc531; }
.dot-padding { background: #2ed573; }
.dot-radius { background: #00d2d3; }

.control-group input[type="range"] {
  width: 100%;
  accent-color: var(--primary);
  cursor: pointer;
}

.btn-pill-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.btn-pill {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-pill:hover {
  color: var(--text-main);
  border-color: var(--primary);
}

.btn-pill.active {
  background: rgba(91, 95, 199, 0.25);
  border-color: var(--primary);
  color: #ffffff;
}

.color-preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.preset-btn {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  cursor: pointer;
  transition: transform 0.15s ease;
}

.preset-btn:hover {
  transform: scale(1.05);
}

.color-input {
  width: 100%;
  height: 36px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  cursor: pointer;
}

.lab-code-output {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
}

.lab-code-output .code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-muted);
}

.lab-code-output pre {
  margin: 0;
  font-family: var(--font-code);
  font-size: 12px;
  color: var(--accent-cyan);
  white-space: pre-wrap;
  word-break: break-all;
}

.btn-sm {
  background: rgba(91, 95, 199, 0.2);
  border: 1px solid var(--primary);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.lab-stage {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 32px;
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Box Model Visual Layers */
.box-layer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: padding 0.1s ease;
}

.layer-margin {
  background: rgba(255, 159, 67, 0.15);
  border: 2px dashed #ff9f43;
}

.layer-border {
  background: rgba(251, 197, 49, 0.25);
  border: 2px solid #fbc531;
}

.layer-padding {
  background: rgba(46, 213, 115, 0.2);
  border: 2px dashed #2ed573;
}

.layer-content {
  background: #141722;
  border: 1px solid var(--border-color);
  padding: 24px 32px;
  border-radius: 8px;
  text-align: center;
  color: #ffffff;
}

.layer-tag {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.85;
}

.tag-margin { color: #ff9f43; }
.tag-border { color: #fbc531; }
.tag-padding { color: #2ed573; }
.tag-content { color: var(--text-muted); }

/* Flexbox Visual Stage */
.flex-stage {
  display: flex;
  width: 100%;
  min-height: 280px;
  background: #141722;
  border: 2px dashed var(--border-color);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.2s ease;
}

.flex-creature {
  padding: 16px 20px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 13px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  transition: all 0.2s ease;
}

.creature-icon {
  font-size: 32px;
}

/* Color Preview Card */
.color-preview-card {
  width: 320px;
  min-height: 240px;
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  transition: all 0.2s ease;
}

.color-card-badge {
  display: inline-block;
  align-self: flex-start;
  background: rgba(0,0,0,0.3);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: #ffffff;
}

.color-card-body h4 {
  font-size: 24px;
  margin: 12px 0 6px;
  color: #ffffff;
}

.color-card-body p {
  font-size: 13px;
  opacity: 0.9;
  margin: 0;
  color: #ffffff;
}

.color-card-button {
  background: #ffffff;
  color: #0b0d13;
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  margin-top: 16px;
}

/* CSS Grid Board */
.grid-board {
  width: 100%;
  max-width: 500px;
  transition: all 0.2s ease;
}

.grid-slot {
  background: #141722;
  border: 2px solid #5b5fc7;
  border-radius: 12px;
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.slot-icon {
  font-size: 32px;
}

.slot-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}


/* ===================================================================
   Dedicated Topic Visual Laboratories
   =================================================================== */
.btn-topic-lab {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(99, 102, 241, 0.25));
  border: 1px solid rgba(168, 85, 247, 0.5);
  color: #c084fc;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-topic-lab:hover {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.45), rgba(99, 102, 241, 0.45));
  border-color: #c084fc;
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
}

.topic-lab-modal-card {
  max-width: 1120px;
  width: 95vw;
  height: 86vh;
  max-height: 780px;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  text-align: left;
  border: 1px solid rgba(168, 85, 247, 0.45);
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 50px rgba(168, 85, 247, 0.25);
  background: var(--bg-card);
  border-radius: 16px;
}

.topic-lab-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
}

.topic-lab-modal-heading {
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
}

.btn-close-modal {
  font-size: 18px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
}

.btn-close-modal:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

.topic-lab-modal-body {
  padding: 16px 20px;
  overflow: hidden;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.topic-lab-modal-footer {
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-color);
}

.topic-lab-wrapper {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 16px;
  flex: 1;
  min-height: 0;
  height: 100%;
}

@media (max-width: 920px) {
  .topic-lab-modal-card {
    height: 94vh;
    max-height: none;
  }
  .topic-lab-wrapper {
    grid-template-columns: 1fr;
    overflow-y: auto;
  }
}

.topic-lab-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #0b0f19;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
}

.topic-lab-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(30, 41, 59, 0.7) 0%, #090d16 100%);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  height: 100%;
  min-height: 0;
  position: relative;
  overflow: auto;
}

.topic-lab-status {
  padding: 10px 14px;
  background: rgba(168, 85, 247, 0.12);
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.5;
  color: #e2e8f0;
}

/* ===================================================================
   Evolution Timeline Range Slider
   =================================================================== */
.evolution-slider-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
}

.slider-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.slider-title-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}

.slider-current-stage {

.slider-track-container {
  display: flex;

}

.evolution-range-input {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 6px;
  background: #1e293b;
  outline: none;
  cursor: pointer;
  margin: 6px 0 4px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.2s ease;
}

.evolution-range-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  border: 2px solid #ffffff;
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.8), 0 2px 6px rgba(0, 0, 0, 0.5);
  cursor: grab;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.evolution-range-input::-webkit-slider-thumb:hover {
  transform: scale(1.15);
  box-shadow: 0 0 20px rgba(168, 85, 247, 1);
}

.evolution-range-input::-webkit-slider-thumb:active {
  cursor: grabbing;
  transform: scale(1.25);
}

.evolution-range-input::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  border: 2px solid #ffffff;
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.8);
  cursor: grab;
}

.slider-stops-bar {

}

.slider-stop-point {

  flex-direction: column;
  align-items: center;
  gap: 3px;

  user-select: none;
  transition: all 0.15s ease;
  max-width: 80px;
  text-align: center;
}

.stop-dot {

  height: 18px;
  border-radius: 50%;

  font-weight: 800;

  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.slider-stop-point:hover .stop-dot {
  border-color: #a855f7;
  color: #ffffff;
  transform: scale(1.1);
}

.slider-stop-point.passed .stop-dot {
  background: rgba(45, 212, 191, 0.2);
  border-color: #2dd4bf;
  color: #2dd4bf;
}

.slider-stop-point.active .stop-dot {

  border-color: #ffffff;
  color: #ffffff;
  transform: scale(1.2);
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);

.stop-title {

}

function completeLesson(state, lessonId, starsEarned = 3) {
  if (state.completedLessons.includes(lessonId)) {
    return state;
  }

  const updatedCompleted = [...state.completedLessons, lessonId];
  const updatedStars = state.stars + starsEarned;
  let updatedBadges = [...state.badges];

  if (updatedCompleted.length >= 1 && !updatedBadges.includes('apprentice')) {
    updatedBadges.push('apprentice');
  }
  if (updatedCompleted.length >= 5 && !updatedBadges.includes('star-coder')) {
    updatedBadges.push('star-coder');
  }
  if (updatedCompleted.length >= 10 && !updatedBadges.includes('master-crafter')) {
    updatedBadges.push('master-crafter');
  }
  if (updatedCompleted.length >= 24 && !updatedBadges.includes('js-wizard')) {
    updatedBadges.push('js-wizard');
  }

  return {
    ...state,
    completedLessons: updatedCompleted,
    stars: updatedStars,
    badges: updatedBadges
  };
}

  return state.completedLessons.includes(lessonId);

function listStudentProfiles(storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (!store || !store.getItem) return [];

    const raw = store.getItem(PROFILES_INDEX_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        return parsed;
      }
    }

    // Auto-migrate from legacy single state if present
    const legacyRaw = store.getItem(STORAGE_KEY);
    if (legacyRaw) {
      try {
        const legacy = JSON.parse(legacyRaw);
        const defaultProfile = {
          id: 'prof_default',
          name: legacy.studentName || 'JS Ninja',
          shift: legacy.shift || '1-Smena (10:30 - 12:00)',
          avatar: legacy.studentAvatar || '⚡',
          pin: '',
          createdAt: Date.now(),
          lastActiveAt: Date.now()
        };
        const profiles = [defaultProfile];
        if (store.setItem) {
          store.setItem(PROFILES_INDEX_KEY, JSON.stringify(profiles));
          store.setItem(ACTIVE_PROFILE_ID_KEY, 'prof_default');
          store.setItem(PROFILE_STATE_PREFIX + 'prof_default', JSON.stringify({
            ...legacy,
            profileId: 'prof_default',
            shift: defaultProfile.shift
          }));
        }
        return profiles;
      } catch (err) {}
    }
  } catch (e) {
    console.warn('Error reading student profiles:', e);
  }
  return [];
}

function getActiveProfileId(storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.getItem) {
      const id = store.getItem(ACTIVE_PROFILE_ID_KEY);
      if (id) return id;
    }
    const profiles = listStudentProfiles(store);
    return profiles.length > 0 ? profiles[0].id : 'prof_default';
  } catch (e) {
    return 'prof_default';
  }
}

function setActiveProfileId(profileId, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.setItem) {
      store.setItem(ACTIVE_PROFILE_ID_KEY, profileId);
    }
  } catch (e) {}
}

function registerStudentProfile({ name, shift, avatar, pin }, storage = null) {
  const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
  const profiles = listStudentProfiles(store);

  const cleanName = (name || '').trim() || 'JS Ninja';
  const cleanShift = shift || '1-Smena (10:30 - 12:00)';
  const cleanAvatar = avatar || '⚡';
  const cleanPin = (pin || '').trim();

  const id = 'prof_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
  const newProfile = {
    id,
    name: cleanName,
    shift: cleanShift,
    avatar: cleanAvatar,
    pin: cleanPin,
    createdAt: Date.now(),
    lastActiveAt: Date.now()
  };

  const freshState = {
    ...createInitialState(),
    profileId: id,
    studentName: cleanName,
    studentAvatar: cleanAvatar,
    shift: cleanShift,
    stars: 0,
    completedLessons: [],
    badges: []
  };

  const updatedProfiles = [...profiles, newProfile];

  if (store && store.setItem) {
    store.setItem(PROFILES_INDEX_KEY, JSON.stringify(updatedProfiles));
    store.setItem(ACTIVE_PROFILE_ID_KEY, id);
    store.setItem(PROFILE_STATE_PREFIX + id, JSON.stringify(freshState));
    store.setItem(STORAGE_KEY, JSON.stringify(freshState));
  }

  return { profile: newProfile, state: freshState };
}

function loginStudentProfile(profileId, pin = '', storage = null) {
  const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
  const profiles = listStudentProfiles(store);
  const target = profiles.find(p => p.id === profileId);

  if (!target) {
    return { success: false, error: 'NOT_FOUND' };
  }

  if (target.pin && target.pin !== pin) {
    return { success: false, error: 'INCORRECT_PIN' };
  }

  // Update last active
  const updatedProfiles = profiles.map(p => {
    if (p.id === profileId) {
      return { ...p, lastActiveAt: Date.now() };
    }
    return p;
  });

  if (store && store.setItem) {
    store.setItem(PROFILES_INDEX_KEY, JSON.stringify(updatedProfiles));
    store.setItem(ACTIVE_PROFILE_ID_KEY, profileId);
  }

  const loadedState = loadProfileState(profileId, store);
  if (store && store.setItem) {
    store.setItem(STORAGE_KEY, JSON.stringify(loadedState));
  }

  return { success: true, profile: target, state: loadedState };
}

function loadProfileState(profileId, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (!store || !store.getItem) return createInitialState();

    const raw = store.getItem(PROFILE_STATE_PREFIX + profileId);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        ...createInitialState(),
        ...parsed,
        profileId
      };
    }
  } catch (e) {
    console.warn(`Error loading profile state ${profileId}:`, e);
  }
  return createInitialState();
}

function saveProfileState(profileId, state, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.setItem) {
      const toSave = {
        ...state,
        profileId
      };
      store.setItem(PROFILE_STATE_PREFIX + profileId, JSON.stringify(toSave));
    }
  } catch (e) {
    console.warn(`Error saving profile state ${profileId}:`, e);
  }
}

function deleteStudentProfile(profileId, storage = null) {
  const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
  if (!store) return false;

  const profiles = listStudentProfiles(store);
  const filtered = profiles.filter(p => p.id !== profileId);

  if (store.setItem) {
    store.setItem(PROFILES_INDEX_KEY, JSON.stringify(filtered));
  }
  if (store.removeItem) {
    store.removeItem(PROFILE_STATE_PREFIX + profileId);
  }

  const activeId = getActiveProfileId(store);
  if (activeId === profileId) {
    const fallbackId = filtered.length > 0 ? filtered[0].id : 'prof_default';
    setActiveProfileId(fallbackId, store);
  }
  return true;
}

function exportClassroomBackup(storage = null) {
  const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
  const profiles = listStudentProfiles(store);
  const backup = {
    app: 'CodeCraft_JS_Offline',
    version: '2.0',
    exportedAt: new Date().toISOString(),
    profiles: profiles.map(p => {
      const pState = loadProfileState(p.id, store);
      return {
        profile: p,
        state: pState
      };
    })
  };
  return JSON.stringify(backup, null, 2);
}

function importClassroomBackup(jsonString, storage = null) {
  try {
    const data = JSON.parse(jsonString);
    if (!data || !Array.isArray(data.profiles)) {
      return { success: false, error: 'INVALID_BACKUP_FORMAT' };
    }

    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (!store || !store.setItem) return { success: false, error: 'NO_STORAGE' };

    const existingProfiles = listStudentProfiles(store);
    const existingIds = new Set(existingProfiles.map(p => p.id));

    let importedCount = 0;
    const mergedProfiles = [...existingProfiles];

    for (const item of data.profiles) {
      if (!item.profile || !item.profile.id) continue;
      const p = item.profile;
      const s = item.state || createInitialState();

      if (!existingIds.has(p.id)) {
        mergedProfiles.push(p);
        existingIds.add(p.id);
      }
      store.setItem(PROFILE_STATE_PREFIX + p.id, JSON.stringify(s));
      importedCount++;
    }

    store.setItem(PROFILES_INDEX_KEY, JSON.stringify(mergedProfiles));
    return { success: true, count: importedCount };
  } catch (e) {
    return { success: false, error: e.message };
  }
}

function saveStateToStorage(state, storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (store && store.setItem) {
      store.setItem(STORAGE_KEY, JSON.stringify(state));
      if (state.profileId) {
        saveProfileState(state.profileId, state, store);
      }
    }
  } catch (e) {
    console.warn('Could not save state to storage:', e);
  }
}

function loadStateFromStorage(storage = null) {
  try {
    const store = storage || (typeof window !== 'undefined' ? window.localStorage : null);
    if (!store || !store.getItem) {
      return createInitialState();
    }

    const activeId = getActiveProfileId(store);
    if (activeId) {
      const pState = loadProfileState(activeId, store);
      if (pState && pState.studentName) {
        return pState;
      }
    }

    const saved = store.getItem(STORAGE_KEY);
    if (!saved) {
      return createInitialState();
    }

    const parsed = JSON.parse(saved);
    return {
      ...createInitialState(),
      ...parsed
    };
  } catch (e) {
    console.warn('Could not load state from storage:', e);
    return createInitialState();
  }
}


  // --- Audio Module ---
  /**
 * Audio Synthesizer Module
 * Uses Web Audio API to create joyful retro game sound effects.
 * 100% offline, zero audio assets required!
 */

let audioCtx = null;

function getAudioContext() {
  if (typeof window === 'undefined') return null;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type = 'click', isEnabled = true) {
  if (!isEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    switch (type) {
      case 'click': {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
        break;
      }

      case 'star': {
        // High sparkling bell chime
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + (i * 0.06);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.12, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
        break;
      }

      case 'success': {
        // Joyful fanfare: C - E - G - high C
        const notes = [
          { f: 523.25, d: 0.1 },  // C5
          { f: 659.25, d: 0.1 },  // E5
          { f: 783.99, d: 0.12 }, // G5
          { f: 1046.5, d: 0.35 }  // C6
        ];
        let offset = 0;
        notes.forEach(({ f, d }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + offset;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + d);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + d + 0.05);

          offset += d * 0.85;
        });
        break;
      }

      case 'tryAgain': {
        // Playful cartoon "boing"
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
        break;
      }

      case 'badge': {
        // Power-up ascending flourish
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
        break;
      }
    }
  } catch (e) {
    console.debug('Audio error:', e);
  }
}


  // --- Confetti Module ---
  /**
 * Confetti Celebration Engine
 * Renders colorful stars, confetti ribbons, and sparkles on canvas.
 */

function triggerConfetti(canvasElement) {
  if (!canvasElement) return;

  const ctx = canvasElement.getContext('2d');
  if (!ctx) return;

  const width = (canvasElement.width = window.innerWidth);
  const height = (canvasElement.height = window.innerHeight);

  const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#e056fd', '#00d2d3'];
  const particles = [];
  const particleCount = 120;

  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: width / 2,
      y: height / 2 + 50,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 0.8) * 22,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 12,
      opacity: 1,
      shape: Math.random() > 0.4 ? 'rect' : 'star'
    });
  }

  let animationFrameId;

  function render() {
    ctx.clearRect(0, 0, width, height);

    let activeCount = 0;

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45; // gravity
      p.vx *= 0.98; // air resistance
      p.rotation += p.vRot;
      p.opacity -= 0.009; // fade out

      if (p.opacity > 0 && p.y < height + 50) {
        activeCount++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.6);
        } else {
          // Draw mini star
          ctx.beginPath();
          for (let s = 0; s < 5; s++) {
            ctx.lineTo(
              Math.cos(((18 + s * 72) * Math.PI) / 180) * p.size,
              -Math.sin(((18 + s * 72) * Math.PI) / 180) * p.size
            );
            ctx.lineTo(
              Math.cos(((54 + s * 72) * Math.PI) / 180) * (p.size / 2),
              -Math.sin(((54 + s * 72) * Math.PI) / 180) * (p.size / 2)
            );
          }
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }
    }

    if (activeCount > 0) {
      animationFrameId = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, width, height);
      cancelAnimationFrame(animationFrameId);
    }
  }

  render();
}


  // --- Speech Module ---
  /**
 * Speech Narrator Module
 * Uses Web Speech API to read lessons and challenge missions aloud to kids.
 */

let currentUtterance = null;

function speakText(text, lang = 'en', onEndCallback = null) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    console.warn('Speech synthesis not supported in this environment');
    if (onEndCallback) onEndCallback();
    return;
  }

  // Stop any ongoing speech
  window.speechSynthesis.cancel();

  if (!text) {
    if (onEndCallback) onEndCallback();
    return;
  }

  // Clean HTML tags or markdown formatting
  const plainText = text.replace(/<[^>]+>/g, '').replace(/[#*`_]/g, '');

  const utterance = new SpeechSynthesisUtterance(plainText);
  utterance.rate = 0.95; // slightly slower, clear for kids
  utterance.pitch = 1.05; // friendly, upbeat
  utterance.lang = lang === 'uz' ? 'uz-UZ' : 'en-US';

  // Find best matching voice
  const voices = window.speechSynthesis.getVoices() || [];
  if (voices.length > 0) {
    let bestVoice = null;
    if (lang === 'uz') {
      bestVoice = voices.find(v => v.lang.startsWith('uz')) || voices.find(v => v.lang.startsWith('ru'));
    }
    if (!bestVoice) {
      bestVoice = voices.find(
        v => (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Zira')) && v.lang.startsWith('en')
      ) || voices.find(v => v.lang.startsWith('en'));
    }
    if (bestVoice) {
      utterance.voice = bestVoice;
    }
  }

  utterance.onend = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  utterance.onerror = () => {
    currentUtterance = null;
    if (onEndCallback) onEndCallback();
  };

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    currentUtterance = null;
  }
}

function isSpeaking() {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return false;
  return window.speechSynthesis.speaking;
}

  function attachEvents() {
    // Close button
    modal.querySelector('#btn-close-portal')?.addEventListener('click', () => modal.remove());
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();
    });

    // Tab buttons
    modal.querySelector('#tab-btn-login')?.addEventListener('click', () => { activeTab = 'login'; renderModalContent(); });
    modal.querySelector('#tab-btn-register')?.addEventListener('click', () => { activeTab = 'register'; renderModalContent(); });
    modal.querySelector('#tab-btn-backup')?.addEventListener('click', () => { activeTab = 'backup'; renderModalContent(); });
    modal.querySelector('#btn-go-to-reg')?.addEventListener('click', () => { activeTab = 'register'; renderModalContent(); });

    // Shift filter pills
    modal.querySelectorAll('.portal-shift-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedShiftFilter = btn.getAttribute('data-filter-shift') || 'all';
        renderModalContent();
      });
    });

    // Add student to specific shift button
    modal.querySelector('#btn-add-to-shift')?.addEventListener('click', () => {
      if (selectedShiftFilter === '1') defaultRegShift = '1-Smena (10:30 - 12:00)';
      else if (selectedShiftFilter === '2') defaultRegShift = '2-Smena (14:00 - 15:30)';
      else if (selectedShiftFilter === '3') defaultRegShift = '3-Smena (15:30 - 17:00)';
      activeTab = 'register';
      renderModalContent();
    });

    // Select student in login tab
    modal.querySelectorAll('.btn-card-select').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const profiles = listStudentProfiles();
        const p = profiles.find(x => x.id === id);
        if (!p) return;

        let pin = '';
        if (p.pin) {
          pin = prompt(isUz ? "Maxfiy 4 xonali PIN-kodni kiriting:" : "Enter your 4-digit secret PIN:");
          if (pin === null) return;
        }

        const res = loginStudentProfile(id, pin);
        if (res.success) {
          playSound?.('success', true);
          onProfileSwitched?.(res.state, res.profile);
          modal.remove();
        } else {
          playSound?.('tryAgain', true);
          alert(isUz ? "❌ PIN-kod noto'g'ri kiritildi!" : "❌ Incorrect PIN!");
        }
      });
    });

    // Avatar pickers in register tab
    modal.querySelectorAll('.avatar-pick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedAvatar = btn.getAttribute('data-avatar');
        modal.querySelectorAll('.avatar-pick-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    // Form submit for registration
    modal.querySelector('#form-register-student')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = modal.querySelector('#reg-name')?.value;
      const shift = modal.querySelector('#reg-shift')?.value;
      const pin = modal.querySelector('#reg-pin')?.value;

      const { profile, state: freshState } = registerStudentProfile({
        name,
        shift,
        avatar: selectedAvatar,
        pin
      });

      playSound?.('success', true);
      onProfileSwitched?.(freshState, profile);
      modal.remove();
    });

    // Export to USB JSON file
    modal.querySelector('#btn-export-backup')?.addEventListener('click', () => {
      const backupJson = exportClassroomBackup();
      const dateStr = new Date().toISOString().slice(0, 10);
      const filename = `codecraft_js_backup_${dateStr}.json`;

      const blob = new Blob([backupJson], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      playSound?.('click', true);
    });

    // Trigger Import file input
    const fileInput = modal.querySelector('#file-import-backup');
    modal.querySelector('#btn-trigger-import')?.addEventListener('click', () => {
      fileInput?.click();
    });

    fileInput?.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target?.result;
        const res = importClassroomBackup(text);
        if (res.success) {
          playSound?.('success', true);
          alert(isUz ? `✅ ${res.count} ta o'quvchi ma'lumotlari muvaffaqiyatli yuklandi!` : `✅ ${res.count} student profiles imported successfully!`);
          renderModalContent();
        } else {
          playSound?.('tryAgain', true);
          alert(isUz ? "❌ Faylni o'qishda xatolik yuz berdi." : "❌ Failed to parse backup file.");
        }
      };
      reader.readAsText(file);
    });

    // Delete student profile in backup tab
    modal.querySelectorAll('.btn-delete-student').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del-id');
        const confirmMsg = isUz ? "Haqiqatan ham ushbu o'quvchi profilini o'chirmoqchimisiz?" : "Are you sure you want to delete this student profile?";
        if (confirm(confirmMsg)) {
          deleteStudentProfile(id);
          playSound?.('click', true);
          renderModalContent();
        }
      });
    });
  }

  renderModalContent();
  document.body.appendChild(modal);
}

function openTopicLabModal(lessonId, lesson, state, playSound) {
  playSound?.('click', state.audioEnabled);

  const lab = getTopicLab(lessonId, lesson);
  const isUz = state.lang === 'uz';
  let currentStageIndex = 0;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'topic-lab-modal';

  function renderContent() {
    const stage = lab.stages[currentStageIndex];

    modal.innerHTML = `
      <div class="modal-card topic-lab-modal-card">
        <div class="topic-lab-header">
          <div class="topic-lab-header-left">
            <span class="topic-lab-icon">🧪</span>

                </button>
              `).join('')}
            </div>

            <div class="lab-slider-track-container">
              <input type="range" id="lab-stage-slider" class="lab-stage-range" min="0" max="${lab.stages.length - 1}" step="1" value="${currentStageIndex}" />
            </div>
          </div>

          <div class="topic-lab-split">
            <div class="topic-lab-preview-pane">
              <div class="topic-lab-pane-title">⚡ ${isUz ? "Jonli Vizual Sahna" : "Live Visual Stage"}</div>
              <div class="topic-lab-scene-container" id="topic-lab-scene">
                ${stage.renderVisual()}
              </div>
              <div class="stage-effect-callout">
                <strong>${isUz ? "Holatga ta'siri:" : "Effect on State:"}</strong>
                <span>${escapeHtml(isUz ? stage.effect.uz : stage.effect.en)}</span>
              </div>
            </div>

            <div class="topic-lab-code-pane">
              <div class="topic-lab-pane-title">💻 ${isUz ? "Ushbu Bosqichdagi Kod" : "Code at this Stage"}</div>
              <pre class="topic-lab-code-block"><code>${escapeHtml(stage.code)}</code></pre>
            </div>
          </div>
        </div>

        <div class="topic-lab-footer">
          <button id="btn-stage-prev" class="btn-modal" ${currentStageIndex === 0 ? 'disabled' : ''} style="background:var(--bg-surface); border:1px solid var(--border-color); color:white;">
            ⬅️ ${isUz ? "Oldingi Bosqich" : "Previous Stage"}
          </button>
          <span style="font-size:13px; font-weight:700; color:var(--text-muted);">
            ${isUz ? "Bosqich" : "Stage"} ${currentStageIndex + 1} / ${lab.stages.length}
          </span>
          <button id="btn-stage-next" class="btn-modal btn-modal-primary" ${currentStageIndex === lab.stages.length - 1 ? 'disabled' : ''}>
            ${isUz ? "Keyingi Bosqich" : "Next Stage"} ➡️
          </button>
        </div>
      </div>
    `;

    attachEvents();
  }

  function attachEvents() {
    modal.querySelector('#btn-close-topic-lab')?.addEventListener('click', () => modal.remove());
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();
    });

    const slider = modal.querySelector('#lab-stage-slider');
    slider?.addEventListener('input', (e) => {
      currentStageIndex = parseInt(e.target.value, 10);
      playSound?.('click', state.audioEnabled);
      renderContent();
    });

    modal.querySelectorAll('.lab-stage-label-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-stage-idx'), 10);
        currentStageIndex = idx;
        playSound?.('click', state.audioEnabled);
        renderContent();
      });
    });

    modal.querySelector('#btn-stage-prev')?.addEventListener('click', () => {
      if (currentStageIndex > 0) {
        currentStageIndex--;
        playSound?.('click', state.audioEnabled);
        renderContent();
      }
    });

    modal.querySelector('#btn-stage-next')?.addEventListener('click', () => {
      if (currentStageIndex < lab.stages.length - 1) {
        currentStageIndex++;
        playSound?.('click', state.audioEnabled);
        renderContent();
      }
    });
  }

  renderContent();
  document.body.appendChild(modal);
}

    // Console interceptor
    window._capturedLogs = [];
    ['log', 'warn', 'error', 'info'].forEach(method => {
      const orig = console[method];
      console[method] = function(...args) {
        window._capturedLogs.push({ method, args: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)) });
        window.parent.postMessage({ type: 'CONSOLE_LOG', method, text: args.join(' ') }, '*');
        if (orig) orig.apply(console, args);
      };
    });

    // Alert & Prompt interceptors
    window.alert = function(msg) {
      window._capturedLogs.push({ method: 'alert', args: [msg] });
      window.parent.postMessage({ type: 'CONSOLE_ALERT', text: String(msg) }, '*');
    };

    window.prompt = function(msg, def) {
      const res = window.parent.prompt ? window.parent.prompt(msg, def || '') : (def || 'Ali');
      window._capturedLogs.push({ method: 'prompt', args: [msg, '->', res] });
      return res;
    };
  ${tagClose}

  ${tagOpen}
    try {
      ${String(code || '').replace(/<\/script>/gi, '<\\/script>')}
    } catch (err) {
      window._capturedLogs.push({ method: 'error', args: [err.message] });
      try {
        window.parent.postMessage({ type: 'CONSOLE_LOG', method: 'error', text: '❌ Xatolik (Error): ' + err.message }, '*');
      } catch (e) {}
    }
  ${tagClose}
</body>
</html>`;

  return new Promise((resolve) => {
    if (!livePreviewFrame) {
      // Node or headless test fallback
      try {
        const consoleCapture = [];
        const mockConsole = {
          log: (...a) => consoleCapture.push(a.join(' ')),
          warn: (...a) => consoleCapture.push('[WARN] ' + a.join(' ')),
          error: (...a) => consoleCapture.push('[ERROR] ' + a.join(' '))
        };
        const mockDocument = {
          querySelector: (sel) => ({
            textContent: 'Sample Text',
            style: {},
            addEventListener: () => {}
          })
        };
        const fn = new Function('console', 'document', 'alert', 'prompt', code);
        fn(mockConsole, mockDocument, (m) => consoleCapture.push('[ALERT] ' + m), () => 'Ali');
        return resolve({ success: true, logs: consoleCapture });
      } catch (err) {
        return resolve({ success: false, error: err.message, logs: [] });
      }
    }

    // 100% Offline file:// protocol compatible iframe execution
    livePreviewFrame.srcdoc = sandboxHtml;
    livePreviewFrame.onload = () => {
      setTimeout(() => {
        let captured = [];
        try {
          captured = livePreviewFrame.contentWindow._capturedLogs || [];
        } catch (e) {
          // If cross-origin prevented direct property read, messages were received via postMessage
        }
        resolve({
          success: true,
          logs: captured
        });
      }, 50);
    };
  });
}

function localize(val, lang = 'en') {
  if (val === null || val === undefined) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'object') {
    return val[lang] || val.en || Object.values(val)[0] || '';
  }
  return String(val);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatProse(str) {
  if (str === null || str === undefined) return '';
  const text = String(str);
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'CONSOLE_LOG') {

    } else if (e.data.type === 'CONSOLE_ALERT') {
